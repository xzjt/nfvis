  /interfaces/{name}/dpdk:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: |
          接口名**或 PCI 地址**（如 0000:13:00.0）。已被 DPDK 接管的网卡在内核中无 netdev，
          此时只能按 PCI 定位——而这正是解绑的常态。
    put:
      tags: [interfaces]
      summary: 网卡 DPDK 驱动接管/解绑（FR-NET-001）
      description: |
        把物理网卡绑定到 DPDK 用户态驱动（缺省 vfio-pci）或解绑交还内核驱动。
        实现为 sysfs 标准流程（`driver_override` + `bind`/`unbind`）；
        绑定会**中断该网卡现有流量**，且该网卡不得正被 VPP 使用，故需 `confirm=true`。
        先前该能力在产品内完全缺失，实机需人工/安装期带外完成（决策 #72）。
      parameters:
        - { name: confirm, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bound]
              properties:
                bound: { type: boolean, description: true = 绑定到 DPDK 驱动；false = 解绑交还内核 }
                uio_driver: { type: string, enum: [vfio-pci, igb-uio], description: 绑定语义下缺省 vfio-pci }
                to_driver:
                  type: string
                  description: |
                    解绑语义（bound=false）下交还的内核驱动名。实测 nfvis-vm（内核 6.x + vfio-pci）：
                    仅清空 driver_override 并 rescan **不足以**让内核重新探测原生驱动，
                    建议显式给出（如 vmxnet3）；未给出且未自动绑定时返回可操作错误。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  interface: { type: string }
                  pci: { type: string }
                  driver: { type: string, description: 操作后该网卡绑定的驱动 }
        "400": { $ref: "#/components/responses/Error400" }
        "404": { $ref: "#/components/responses/Error404" }

  /system/login-banner:
    put:
      tags: [system]
      summary: 设置登录横幅（等价 CLI set system login banner）
      description: |
        一次性事务：取配置编辑锁 → 写候选 → 立即提交生效（同 /system/login-users 一族），
        入配置提交审计。横幅为**单行文本、最长 512 字节**：超限或含换行时校验拒绝并说明上限。
        注意：横幅在登录前（未认证）即可见，请勿写入敏感信息。
        **本会话已有未提交候选时拒绝**（决策 #316）：见 `POST /system/login-users` 同款口径。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginBanner" }
      responses:
        "200": { description: 已更新（入审计） }
        "400": { $ref: "#/components/responses/Error400" }
        "409": { $ref: "#/components/responses/Error409" }   # 本会话候选未提交（决策 #316）
    delete:
      tags: [system]
      summary: 清除登录横幅（等价 CLI delete system login banner）
      description: |
        一次性事务：提交即生效、收尾交还编辑锁（同 `PUT /system/login-banner`）。
        **本会话已有未提交候选时拒绝**（决策 #316）。
      responses:
        "200": { description: 已清除（入审计） }
        "409": { $ref: "#/components/responses/Error409" }   # 本会话候选未提交（决策 #316）

  /system/login-users/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    put:
      tags: [system]
      summary: 修改用户（class/口令，需 super-user）
      description: |
        一次性事务：提交即生效、收尾交还编辑锁（决策 #151，同 `POST /system/login-users`）。
        **本会话已有未提交候选时拒绝**（决策 #316）：见 `POST /system/login-users` 同款口径。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                class: { type: string }
                password: { type: string, format: password }
      responses:
        "200": { description: 已更新（入审计） }
        "409": { $ref: "#/components/responses/Error409" }   # 本会话候选未提交（决策 #316）
    delete:
      tags: [system]
      summary: 删除用户
      description: 一次性事务：提交即生效、收尾交还编辑锁（决策 #151，同 `POST /system/login-users`）。
      responses:
        "204": { description: 已删除 }
        "409": { $ref: "#/components/responses/Error409" }   # 不能删除自己/最后一个 super-user
  /system/login-users/{name}:change-password:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [auth]
      summary: 口令自助修改（登录者本人或 super-user，需旧口令）
      description: |
        一次性事务：校验旧口令 + 策略后提交生效（FR-SEC-008），收尾交还编辑锁（决策 #151）——
        改完口令的会话不再持有全局编辑锁，其它会话的配置写不会被挡（也无需为此登出）。
        **只改口令，不牵动候选**（决策 #316）：本会话已有未提交候选（典型＝控制台配置页正在编辑）时
        **拒绝**（409）并说明「先提交或丢弃候选」——绝不再把那份候选一并提交生效（round77 观察项）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        "200": { description: 已修改（入审计） }
        "403": { $ref: "#/components/responses/Error403" }
        "409": { $ref: "#/components/responses/Error409" }   # 本会话候选未提交（决策 #316）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: nfvis-token

  responses:
    ConfigAccepted:
      description: "已写入 candidate（无 Auto-Commit 头）或已提交生效（带 X-NFVIS-Auto-Commit: true）"
      headers:
        X-NFVIS-Committed:
          schema: { type: boolean }
          description: true 表示本次请求已直接提交
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommitResult" }
    Error400: { description: "校验失败（含提交后一个 super-user 都不剩的自锁拒绝）", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Error401: { description: 未认证, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Error403: { description: 无权限或账号锁定, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Error404: { description: 资源不存在, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Error409: { description: 冲突（引用存在/配额不足/会话锁占用）, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string }
        detail:
          type: array
          items:
            type: object
            properties:
              path: { type: string, example: "virtual-machine-functions[fw-vm].memory.size-mb" }
              message: { type: string, example: "资源池大页 1G 不足：需要 8，空闲 2" }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: Bearer token 本体；仅登录响应出现这一次 }
        token_id: { type: string, description: token 稳定 ID（UUID）；列表/吊销按它定位，重启后失效 }
        user: { $ref: "#/components/schemas/LoginUser" }
        expires_in: { type: integer }

    LoginBanner:
      type: object
      properties:
        banner:
          type: string
          maxLength: 512
          description: 横幅文本；未设置时省略该字段（不回空串、不编造）

    ApiTokenList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items: { $ref: "#/components/schemas/ApiToken" }

    ApiToken:
      type: object
      required: [token_id, user, class, issued_at, expires_at, current]
      properties:
        token_id: { type: string, description: token 稳定 ID（UUID）；吊销按它定位 }
        user: { type: string, description: 签发时认证的用户名 }
        class: { type: string, description: 该会话继承的权限类 }
        issued_at: { type: string, format: date-time, description: 签发时间 }
        expires_at: { type: string, format: date-time, description: 过期时间（TTL 到期即失效） }
        current: { type: boolean, description: 是否发起本次请求的会话 }

    LoginUser:
      type: object
      required: [name]
      properties:
        name: { type: string }
        class: { type: string, example: super-user }
        kind: { type: string, enum: [user, class], description: 区分用户与 class 定义 }

    ClassPermissions:
      type: object
      description: |
        某 login class 的**生效权限视图**（等价 CLI `show configuration permissions <class>`，
        决策 #304）：把该 class 在 CLI 命令树上的有效判定逐路径算出来。判定与 CLI 同一实现
        （`internal/aaa`，与运行期授权同一套函数），响应只是同一份事实的 JSON 形态。
      required: [class, source, allowed_count, denied_count, allowed_paths, allow_rules, deny_rules]
      properties:
        class: { type: string, description: 目标 class 名 }
        source: { type: string, enum: [preset, custom], description: 预置三档（super-user/operator/read-only）或自定义 class }
        allowed_count: { type: integer, description: 允许的命令路径条数 }
        denied_count: { type: integer, description: 拒绝的命令路径条数 }
        allowed_paths:
          type: array
          items: { type: string }
          description: 允许的命令路径（与 CLI 视图同一枚举与判定；按命令树顺序）
        allow_rules:
          type: array
          items: { type: string }
          description: 自定义 class 的 allow 路径前缀（预置 class 为空数组）
        deny_rules:
          type: array
          items: { type: string }
          description: 自定义 class 的 deny 路径前缀（预置 class 为空数组）

    SystemStatus:
      type: object
      description: |
        系统状态摘要。数据源与 CLI 的 `show system uptime|cpu|memory|storage` **同源**
        （`internal/metrics.HostMetrics()`，Linux 采集），`hugepages` 与 `/resource-pools` 同源。
      properties:
        hostname: { type: string, description: 配置声明的 system.hostname 优先；未声明时回退主机实际主机名（os.Hostname）；两者都取不到时为空串（不编造） }
        uptime_seconds: { type: integer, description: 主机运行时长（/proc/uptime，与 CLI `show system uptime` 同源；非 Linux 取不到时退回守护进程运行时长） }
        config_ready: { type: boolean, description: 配置库可用（已建库且可读 committed） }
        cpu:
          type: object
          properties:
            total: { type: integer, description: 在线核数 }
            isolated: { type: array, items: { type: integer }, description: 隔离核（取自资源池配置） }
            usage_percent: { type: number, description: 整机使用率（0-100） }
        memory:
          type: object
          properties:
            total_mb: { type: integer }
            used_mb: { type: integer, description: total - available }
        hugepages:
          type: array
          description: 各页大小的池用量（与 `/resource-pools.hugepages` 同源；产品有 1G/2M 两个池）
          items:
            type: object
            properties:
              page_size: { type: string, enum: [1G, 2M] }
              total: { type: integer }
              allocated: { type: integer }
              free: { type: integer }
        storage:
          type: object
          description: 根文件系统（与 CLI `show system storage` 同源）
          properties:
            total_bytes: { type: integer, format: int64 }
            free_bytes: { type: integer, format: int64 }
            used_ratio: { type: number, description: 已用比例（0-1） }

    VersionInfo:
      type: object
      description: |
        组件版本汇总（FR-SYS-007）。探测不到的键**缺席**（不编造空串）：ubuntu 读
        /etc/os-release（非 Linux 无该文件时缺席）；vpp 与 `/vpp/status` 同源（VPP 未接入
        或未连接时缺席）；libvirt/qemu/docker 经底座命令探测（未安装、守护进程未运行或
        不在 PATH 时缺席）；dpdk 没有可靠版本来源（随 VPP 静态链接、VPP binary API 的
        show_version 不含、运行进程无独立 DPDK 库可读），有意不汇报。
      properties:
        nfvis: { type: string, example: "1.0.0" }
        ubuntu: { type: string, example: "26.04 LTS" }
        vpp: { type: string, example: "26.06" }
        dpdk: { type: string }
        libvirt: { type: string }
        qemu: { type: string }
        docker: { type: string }

    VppStatus:
      type: object
      description: VPP 数据面状态（FR-SYS-007 版本锁定、FR-SYS-009 pending-restart、运行态线程）
      properties:
        version: { type: string, example: "26.06-release", description: 探测到的 VPP 版本 }
        connected: { type: boolean, description: 当前是否已连接 }
        config_revision: { type: integer, description: 当前 committed 配置版本（供判断数据面是否落后于配置） }
        pending_restart:
          type: boolean
          description: committed vpp 段与已应用 startup.conf 不一致（需 request vpp restart）
        last_error: { type: string, description: 最近一次连接错误（无则省略） }
        threads:
          type: array
          description: 数据面线程（VPP show_threads；未连接时省略）
          items: { $ref: "#/components/schemas/VppThread" }
        buffers:
          type: array
          description: |
            buffer 池用量。来源见 `buffers_source`；不可用时**省略数组但须给出
            `buffers_unavailable` 原因**（不静默省略，决策 #68）。
          items:
            type: object
            properties:
              name: { type: string }
              used: { type: number }
              available: { type: number }
              cached: { type: number }
        buffers_source:
          type: string
          enum: [statsclient, vpp_get_stats]
          description: |
            buffer 池统计来源。`statsclient` = govpp stats segment 解码；
            `vpp_get_stats` = statsclient 解码失败或全零时回退 VPP 自带同版本工具
            （VPP 26.06 的 buffer 池值类型 govpp v0.13.0 无法解码，决策 #68）。无数据时省略。
        buffers_unavailable:
          type: string
          description: buffer 池统计不可用的原因（有数据时省略；决策 #68）
        memory:
          type: object
          description: main heap 内存合计（stats segment；不可用时省略）
          properties:
            total: { type: integer, format: int64 }
            used: { type: integer, format: int64 }
            free: { type: integer, format: int64 }

    VppThread:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: vpp_main }
        type: { type: string, example: workers }
        core: { type: integer, description: 绑核（CPU） }

    SystemConfig:
      type: object
      properties:
        hostname: { type: string }
        timezone: { type: string, example: "Asia/Shanghai" }
        ntp:
          type: array
          items:
            type: object
            properties:
              server: { type: string }
              prefer: { type: boolean }
        dns_servers: { type: array, items: { type: string } }
        management:
          type: object
          description: |
            管理口（独立管理网卡，内核驱动，**不得用于数据面**，FR-NET-002/FR-SEC-001）。
            指定 `interface` 后，commit 校验会拒绝该网卡出现在 `vpp.dpdk.dev`、
            bond 成员、虚拟交换机端口、L3 接口等任何数据面引用中（决策 #71）。
          properties:
            interface: { type: string, description: "管理网卡名（如 ens160）；须保留内核驱动", example: "ens160" }
            address: { type: string, example: "192.168.1.10/24" }
            gateway: { type: string }
        login:
          type: object
          description: 本地用户与 login class（FR-SEC-002/003；口令仅存加盐 PBKDF2 哈希，附录 A #25）
          properties:
            banner:
              type: string
              maxLength: 512
              description: |
                登录横幅（单行文本，最长 512 字节）：显示在 Web 登录页与 CLI 登录提示之前，
                未认证即可见，请勿写入敏感信息。未设置时该字段省略。
            users:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  password_hash:
                    type: string
                    format: password
                    description: "PBKDF2-SHA256 加盐哈希，格式 pbkdf2$sha256$<iter>$<b64salt>$<b64hash>；写入仅经 API/CLI，永不回显"
                  class: { type: string, example: super-user }
            classes:
              type: array
              description: 自定义 class（命令路径 allow/deny；预置 super-user/operator/read-only 见命令树 §4）
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  allow: { type: array, items: { type: string }, description: 允许的命令树路径前缀 }
                  deny: { type: array, items: { type: string }, description: 拒绝的命令树路径前缀（优先于 allow） }
            password_policy:
              type: object
              properties:
                min_length: { type: integer, default: 8 }
                complexity: { type: boolean, description: 要求至少 3/4 类字符（大写/小写/数字/特殊） }
                expire_days: { type: integer }
                lockout_threshold: { type: integer, default: 5, description: 连续失败锁定阈值 }
                lockout_minutes: { type: integer, default: 10, description: 锁定时长 }
        syslog:
          type: object
          properties:
            remote_host: { type: string, description: 远程 syslog 目标（FR-SYS-004） }
            remote_port: { type: integer, description: 远程 syslog 端口（缺省 514） }
            facility:
              type: string
              enum: [kern, user, mail, daemon, auth, syslog, lpr, news, uucp, cron, authpriv, ftp, local0, local1, local2, local3, local4, local5, local6, local7]
              description: RFC 5424 facility（缺省 user；FR-SYS-004）
            severity:
              type: string
              enum: [debug, info, warn, error]
              description: 远程转发的最低级别（缺省 info；FR-SYS-004）
            level: { type: string, enum: [debug, info, warn, error], description: 本地/守护进程日志级别（FR-OPS-030） }
            retention_days: { type: integer, description: 本地日志保留天数（FR-SYS-013） }
            max_size_mb: { type: integer, description: 本地日志容量上限，滚动覆盖 }
        api:
          type: object
          properties:
            port: { type: integer }
            token_ttl_minutes: { type: integer }
            max_sessions: { type: integer }
        idle_timeout_minutes: { type: integer }
        kernel:
          type: object
          description: 内核启动基线（FR-SYS-014；大页/隔离核由 resource-pools 派生）
          properties:
            nmi_watchdog: { type: boolean }
            transparent_hugepages: { type: string, enum: [always, madvise, never] }
            iommu: { type: string, enum: [on, off, pt] }
            low_latency: { type: boolean, description: "低延迟参数组（mitigations=off 等；显式选择，降低安全缓解与可诊断性）" }
            tuned_profile: { type: string }
            params: { type: array, items: { type: string } }

    Interface:
      type: object
      properties:
        name: { type: string, example: "ens2f0" }
        kind: { type: string, enum: [physical, management, vpp-internal] }
        taken_over:
          type: boolean
          description: |
            数据面（VPP）是否已接管该口（决策 #302，首装接口可见性）。true = 该口已出现在
            VPP 运行态；false = 内核侧网卡、VPP 未接管（首装 bind-dpdk 前的事实状态，此类口
            也会出现在本清单，kind 仍为 physical）。VPP 运行态不可判定（未接入/查询失败）时
            省略该字段——不编造。
        driver: { type: string, example: "ice-dpdk" }
        enabled: { type: boolean }
        link: { type: string, enum: [up, down] }
        speed_mbps: { type: integer }
        mtu: { type: integer, description: "有效 MTU：配置显式值优先，否则运行态（VPP sw_interface_details 的 L3 MTU）" }
        mac: { type: string }
        numa_node: { type: integer }
        description: { type: string }
        ingress_policy: { type: string, description: "入向限速策略绑定（决策 #331）" }
        egress_policy: { type: string, description: "出向限速策略绑定（VPP policer output，决策 #331）" }
        sriov:
          type: object
          description: |
            SR-IOV VF 数量（FR-NET-004）。`vf_count` 为**声明式**配置：
            commit 时由编排器写入 PF 的 `sriov_numvfs`（0 = 回收全部），
            恢复收敛时重放；PF 不支持 SR-IOV 时 commit **明确失败**（不静默跳过，决策 #70）。
          properties:
            vf_count: { type: integer, description: 期望 VF 数（0 = 回收全部） }
            vfs:
              type: array
              items:
                type: object
                properties:
                  vf_id: { type: integer }
                  assigned_vnf: { type: string }
        statistics:
          type: object
          properties:
            rx_packets: { type: integer, format: int64 }
            tx_packets: { type: integer, format: int64 }
            rx_bytes: { type: integer, format: int64 }
            tx_bytes: { type: integer, format: int64 }
            rx_errors: { type: integer, format: int64 }
            tx_errors: { type: integer, format: int64 }
            rx_drops: { type: integer, format: int64 }
            tx_drops: { type: integer, format: int64 }

    InterfaceUpdate:
      type: object
      description: 物理网卡配置视图。在 ConfigDocument（整份配置文档）中 name 必填；PUT /interfaces/{name} 时可省略
      properties:
        name: { type: string, description: 接口名 }
        description: { type: string }
        mtu: { type: integer }
        enabled: { type: boolean }
        sriov:
          type: object
          description: SR-IOV VF 配置（FR-NET-004，命令树 §2.3）
          properties:
            vf_count: { type: integer }
        ingress_policy: { type: string, description: 入向限速策略绑定（命令树 §2.5） }
        egress_policy: { type: string, description: "出向限速策略绑定（命令树 §2.5；VPP policer output，决策 #331）" }

    VppConfig:
      type: object
      properties:
        cpu:
          type: object
          properties:
            main_core: { type: integer }
            corelist_workers: { type: string, example: "5,7" }
            workers_per_numa: { type: integer, description: 与 corelist_workers 互斥 }
        memory:
          type: object
          properties:
            main_heap_size: { type: string, example: "1G" }
            buffers_per_numa: { type: integer }
            hugepage_preference: { type: string, enum: ["2M", "1G"] }
        dpdk:
          type: object
          properties:
            dev:
              type: object
              description: 全局默认（作用于所有未单独配置的物理 NIC）
              properties:
                rx_queues: { type: integer }
                tx_queues: { type: integer }
                rx_descriptors: { type: integer }
                tx_descriptors: { type: integer }
            per_dev:
              type: array
              description: 单网卡覆盖（删除后回落全局默认）
              items:
                type: object
                required: [interface]
                properties:
                  interface: { type: string }
                  rx_queues: { type: integer }
                  tx_queues: { type: integer }
                  rx_descriptors: { type: integer }
                  tx_descriptors: { type: integer }
            uio_driver: { type: string, enum: [vfio-pci, igb-uio] }
        plugins:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              state: { type: string, enum: [enable, disable] }
        dns_proxy_servers:
          type: array
          description: |
            数据面 DNS 代理的**全局上游**（决策 #345，FR-NET-010）：域内 VNF/容器把 resolver 指向
            产品自己的地址即可解析。上游由 nfvisd 用**宿主网络栈**发起（**不是** VPP FIB——决策 #338
            撤回记录里那条边界只适用于 VPP dns 插件形态）。全局或任一交换机
            （见 `VirtualSwitch.dns_proxy_servers`）非空即启用并注册 punt；全空即注销
            （VPP 恢复默认处理）。纯 UDP 转发：不缓存、不解析内容；客户端用 TCP 查 DNS 不在覆盖内。
            覆盖 **IPv4/UDP/53**（punt 按地址族注册）；IPv6 的解析查询尚未覆盖。
          items: { type: string }

    DnsProxyView:
      type: object
      description: 数据面 DNS 代理读视图（`GET /dns/proxy`；与 CLI `show dns proxy` 同源，决策 #345）
      required: [enabled, servers, switches]
      properties:
        enabled:
          type: boolean
          description: |
            全局或任一交换机配了上游即 true（启用判据）；为 false 时**未注册 punt**，
            指向产品地址的 UDP/53 仍由 VPP 按默认处理（不致中断）。
        servers:
          type: array
          description: 全局上游（按声明序；未配置时为空数组，不发 null）
          items: { type: string }
        switches:
          type: array
          description: 按域覆盖（只列**已声明且真配了上游**的交换机；未配置的交换机不出现）
          items:
            type: object
            required: [name, servers]
            properties:
              name: { type: string }
              servers: { type: array, items: { type: string } }

    CaptureFile:
      type: object
      description: 已导出的 pcap 文件
      properties:
        name: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }

    CaptureStatus:
      type: object
      properties:
        active:
          type: object
          nullable: true
          properties:
            interface: { type: string }
            captured: { type: integer }
            started_at: { type: string, format: date-time }
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: "cap-ens2f0-20260912.pcap" }
              size_bytes: { type: integer, format: int64 }
              created_at: { type: string, format: date-time }

    Bond:
      type: object
      required: [name, members]
      properties:
        name: { type: string }
        members: { type: array, items: { type: string } }
        lacp:
          type: object
          nullable: true
          description: null = 静态聚合
          properties:
            mode: { type: string, enum: [active, passive] }
            interval: { type: string, enum: [fast, slow] }
        mtu: { type: integer }
        description: { type: string }
        state:
          type: object
          description: 运行态
          properties:
            link: { type: string, enum: [up, down] }
            active_members: { type: integer }

    LldpConfig:
      type: object
      properties:
        enabled: { type: boolean }
        advertisement_interval: { type: integer, default: 30 }
        interfaces:
          type: array
          items:
            type: object
            properties:
              interface: { type: string }
              enabled: { type: boolean }

    KernelBaseline:
      type: object
      properties:
        cmdline: { type: array, items: { type: string } }
        isolated_cores: { type: string }
        hugepages_1g: { type: integer }
        hugepages_1g_free: { type: integer }
        hugepages_2m: { type: integer }
        hugepages_2m_free: { type: integer }
        thp: { type: string }
        desired:
          type: object
          properties:
            hugepages_1g: { type: integer, description: "-1 = 不托管" }
            hugepages_2m: { type: integer, description: "0 = 不托管；与 1G 同时 >0 时按 hugepagesz 连写进 cmdline（决策 #106）" }
            isolated_cores: { type: string }
            nmi_watchdog: { type: boolean, nullable: true }
            transparent_hugepages: { type: string }
            iommu: { type: string }
            low_latency: { type: boolean }
            tuned_profile: { type: string }
            params: { type: array, items: { type: string } }
        diffs: { type: array, items: { type: string }, description: 差异项（空 = 一致） }

    KernelBaselineAction:
      type: object
      description: 内核基线 apply/rollback 的结果（决策 #146；与 CLI 同源，CLI 把同一结果渲染成文本）
      required: [action]
      properties:
        action: { type: string, enum: [apply, rollback] }
        backup: { type: string, description: "上一版本备份路径（apply 时；无备份为空串，条件出现）" }
        pending_reboot:
          type: array
          items: { type: string }
          description: "需重启才生效的差异（apply 时列出；**恒为数组**——apply 无差异或 rollback 时为空数组，不会发 null）"
        message: { type: string, description: "落地器给的一句话（rollback 时，条件出现）" }

    HugepagePools:
      type: object
      description: 大页池读视图（决策 #329/#346/#353）：数字（声明/内核实际/在用/实际持有/数据面占用/无主占用）+ 可回收的空闲多余页
      properties:
        pools:
          type: array
          description: 恒列 1G 与 2M 两项（形状稳定；读不到的池 state=unreadable 并给 note）
          items:
            type: object
            properties:
              page_size: { type: string, enum: ["1G", "2M"] }
              managed: { type: boolean, description: 配置是否声明该池（声明 > 0） }
              declared: { type: integer, description: 声明页数（配置唯一真源；<=0 = 未声明/不托管） }
              actual: { type: integer, description: 内核实际页数（sysfs nr_hugepages；不可读时 -1） }
              free: { type: integer, description: 内核空闲页数（不可读时 -1）；也就是**可分配给 VNF 的页数**（1G 池需扣除数据面固定占用，见 note） }
              in_use: { type: integer, description: 在用页数 = actual - free（不可读时 -1） }
              held: { type: integer, description: "实际持有页数（进程/inode 引用汇总，按 inode 去重；不可读时 -1）" }
              held_by_dataplane: { type: integer, description: "实际持有中数据面占用的页数（实测：comm 以 vpp 开头的进程（真机 vpp_main）提交的页；不可读时 -1，不编造）；1G 池该值 >=1 时 note 追加可用性说明（数据面固定占用、VNF 可起页数 = 空闲页数，决策 #353）" }
              orphan: { type: integer, description: "无主占用页数 = in_use - held（>=0；不可读时 -1）；多为被进程预留未使用的大页，产品侧不可回收（只作可见性，见 HUGEPAGE_POOL_ORPHAN 告警）" }
              reclaimable: { type: integer, description: 可回收的**空闲多余页**数（无主占用页不可回收，不计入） }
              state: { type: string, enum: [ok, surplus, in_use, orphan, unmanaged, unreadable] }
              note: { type: string, description: "条件出现：判定依据 / 取不到的原因（不编造）" }
        reclaimable: { type: integer, description: 全部池合计可回收页数 }

    HugepageReclaimResult:
      type: object
      description: 大页池回收结果（决策 #329；无主占用页只作可见性、不在回收范围；CLI 把同一结果渲染成文本）
      properties:
        pools:
          type: array
          items:
            type: object
            properties:
              page_size: { type: string, enum: ["1G", "2M"] }
              declared: { type: integer }
              actual_before: { type: integer, description: "回收前内核实际（不可读时 -1）" }
              actual_after: { type: integer, description: "回收后**回读**的内核实际（未写则等于 before；不可读时 -1）" }
              in_use: { type: integer, description: "在用页数（不动的那部分）" }
              free: { type: integer }
              reclaimed: { type: integer, description: "本次回收的页数" }
              action:
                type: string
                enum: [none, reclaimed, partial, blocked, unmanaged, unreadable, verify_failed]
                description: "none=无需回收；reclaimed=已收敛；partial=回收了空闲多余页但仍有在用多余页；blocked=多余页全在用；verify_failed=写入失败/回读不一致"
              reasons: { type: array, items: { type: string }, description: 判定依据（恒为数组） }
              blockers: { type: array, items: { type: string }, description: "条件出现：无法回收时谁在占用（可查到的证据）" }
              error: { type: string, description: "条件出现：写入失败/回读不一致的原因（不谎称收敛）" }
        reclaimed: { type: integer, description: 本次实际回收页数合计 }

    HealthThresholds:
      type: object
      properties:
        cpu_temp_celsius: { type: integer, example: 85 }
        disk_temp_celsius: { type: integer, example: 60 }
        disk_used_percent: { type: integer, example: 90 }

    HardwareHealth:
      type: object
      properties:
        bmc_present: { type: boolean }
        sensors:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: CPU1 Temp }
              type: { type: string, enum: [temperature, fan, voltage, power] }
              value: { type: number }
              unit: { type: string }
              status: { type: string, enum: [ok, warning, critical] }
        disks:
          type: array
          items:
            type: object
            properties:
              device: { type: string }
              smart_status: { type: string, enum: [passed, failed, unknown] }
              temp_celsius: { type: number }
              wear_percent: { type: number }

    TlsInfo:
      type: object
      properties:
        subject: { type: string }
        issuer: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        self_signed: { type: boolean }

    BackupArchive:
      type: object
      properties:
        file: { type: string }
        kind: { type: string, enum: [config-backup, tech-support] }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        includes_core_dumps: { type: boolean, description: tech-support 归档时 }

    FormatDataResult:
      type: object
      description: 决策 #305：`request system storage format-data` / `POST /system:format-data` 的结果统计。
      properties:
        status: { type: string, example: formatted }
        revision: { type: integer, description: 提交保留节配置后的修订号；已是出厂态时为当前修订号 }
        kept_sections:
          type: array
          items: { type: string }
          description: 原样保留的配置节（保命条款）：system.management / system.api / system.login / interfaces / vpp.dpdk
        removed_objects: { $ref: "#/components/schemas/FormatDataRemoved" }
        removed_images: { type: integer, description: 从镜像仓库删除的镜像数 }
        purged_files: { type: integer, description: 受管数据目录里清理的文件数 }
        freed_bytes: { type: integer, format: int64, description: 释放的字节数（镜像记录大小 + 受管目录文件大小） }
        already_factory: { type: boolean, description: 已是出厂态（本次未删任何受管对象/数据）时为 true；幂等第二次执行如实回此值 }
        residuals:
          type: array
          items: { type: string }
          description: 未清掉的残留（逐条含原因）；非空即表示本次未清干净，端点据此返回 500
    FormatDataRemoved:
      type: object
      description: 按类别统计的删除对象数（配置里除保留节之外的一切）。
      properties:
        containers: { type: integer }
        vms: { type: integer }
        virtual_switches: { type: integer }
        vrfs: { type: integer }
        routes: { type: integer }
        acls: { type: integer }
        nat_rules: { type: integer }
        port_mirroring: { type: integer }
        qos_policies: { type: integer }
        bonds: { type: integer }
        lldp_interfaces: { type: integer }

    CoreDump:
      type: object
      properties:
        file: { type: string }
        process: { type: string, example: vpp_main }
        size_bytes: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }

    VirtualSwitch:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [l2, l3] }
        description: { type: string }
        vlan_access: { type: integer, description: 仅 L2：默认 untag VLAN }
        cross_connect: { type: boolean, description: 仅 L2：两端口直通模式 }
        gateway:
          type: object
          description: 仅 L2：BVI 三层网关（FR-NET-014）
          properties:
            addresses: { type: array, items: { type: string }, description: IPv4/IPv6 网关地址 }
            vrf: { type: string, description: 缺省为专属 VRF vr-<name> }
            acl_in:
              type: string
              description: |
                **不支持**：VPP 26.06 不评估网关（BVI）上的域内流量 ACL（既不拦也不计，真机实证），提交期拒绝
                （决策 #340）。入向过滤请改用 L3 接口绑定：`Vrf.l3_interfaces[].acl_in`。本字段保留仅为解析兼容。
            acl_out:
              type: string
              description: '**不支持**（同 acl_in）：提交期拒绝（决策 #340）；ACL 请绑 L3 接口。'
        dns_proxy_servers:
          type: array
          description: |
            数据面 DNS 代理的**按域上游**（决策 #345）：只对该交换机转发域（L2＝网关 BVI；
            L3＝其 l3-interface 地址）的入向查询生效。本域非空优先，否则回落全局
            （`VppConfig.dns_proxy_servers`）；两者皆空时对该域查询回 SERVFAIL。
          items: { type: string }
        dhcp_relay:
          type: object
          description: |
            仅 L2 且已配网关：DHCP 中继（决策 #335）。**读视图形状**（GET 响应）——中继源地址
            自动取 BVI 的 IPv4 网关地址，不随响应给出。未配置时整个对象缺席（不编造）。
          properties:
            server: { type: string, description: DHCP 服务器 IPv4 地址（须在该交换机转发域内可达） }
        dhcp_relay_server:
          type: string
          description: |
            DHCP 中继的服务器地址在**配置库/POST 请求体**里的存储键（与 dhcp_relay.server 同一声明，
            两种形状各司其职：GET 详情/列表回 dhcp_relay 对象，写入与 GET /configuration 用本键）。
            未配置时省略。
        learn_limit:
          type: integer
          description: |
            仅 L2：MAC 学习条数上限（决策 #337）。读视图与配置库**同一键、同值**（不像 dhcp_relay
            那样换形状）；下发 VPP `bridge_domain_set_learn_limit`，是环路/广播风暴的**缓解**手段
            （只告警不阻断，非 STP）。取值 1-16777216（超出拒绝）。未配置时省略（VPP 默认不设限）。
        ports:
          type: array
          items: { $ref: "#/components/schemas/VSwitchPort" }
        statistics:
          type: object
          description: |
            运行态统计（**仅详情端点 `GET /virtual-switches/{name}` 附带**；取自 VPP 运行态，
            与 CLI `show virtual-switches <name> statistics` 同源，FR-NET-016）。
            运行态未接入或交换机不在数据面时不返回（不编造）。
          properties:
            bd_id: { type: integer, description: VPP bridge-domain ID }
            ports:
              type: array
              description: 成员端口的收发计数（每端口一项）
              items:
                type: object
                properties:
                  port: { type: string, description: VPP 侧接口名 }
                  sw_if_index: { type: integer }
                  admin: { type: boolean, description: 管理态（运行态取不到时省略） }
                  link: { type: boolean, description: 链路态（运行态取不到时省略） }
                  rx_packets: { type: integer, description: 收包数（计数不可用时省略） }
                  tx_packets: { type: integer, description: 发包数（计数不可用时省略） }

    VSwitchPort:
      type: object
      required: [seq]
      properties:
        seq: { type: integer }
        interface: { type: string, description: 物理口名（与 vnf/container 三选一） }
        vnf: { type: string }
        vnf_interface: { type: string }
        container: { type: string }
        container_interface: { type: string }
        vlan:
          type: object
          properties:
            trunk: { type: array, items: { type: integer } }
            native: { type: integer }
        acl_in:
          type: string
          description: |
            **不支持**：VPP 26.06 不评估 L2 成员端口上的 ACL（既不拦也不计，真机实证），提交期拒绝（决策 #340）。
            ACL 请绑 L3 接口（`Vrf.l3_interfaces[].acl_in`）。该字段保留仅为解析兼容；命令树也**有意**不提供语句
            （见 `docs/NFViS-CLI命令树完整设计.md`）。
        acl_out:
          type: string
          description: '**不支持**（同 acl_in）：提交期拒绝（决策 #340）；ACL 请绑 L3 接口。'
        state: { type: string, enum: [up, down], description: 运行态 }

    # 决策 #326：交换机成员端口的**读视图**条目（GET /virtual-switches/{name}/ports 的响应）。
    # 与 VSwitchPort 同形，另带 source（来源）与 port（该端口在数据面 VPP 中的接口名，
    # 供运行态列按名合并；SR-IOV VF 等无法确定时为空串，客户端退回 vnf/container 身份展示）。
    # 注意：VSwitchPort 仍是**写**形状（PUT 全量替换静态 ports），ConfigDocument 里也仍是它。
    SwitchPortView:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [config, vnf, container, runtime], description: 端口来源（config=配置静态声明；vnf/container=VNF/容器 vNIC 声明派生；runtime=仅数据面存在的成员） }
        port: { type: string, description: 数据面接口名（vh-<vm>-<nic> / mf-<ct>-<nic> / 物理口名）；无法确定时为空串 }
        seq: { type: integer, description: 配置静态端口的序号（派生条目无） }
        interface: { type: string }
        vnf: { type: string }
        vnf_interface: { type: string }
        container: { type: string }
        container_interface: { type: string }
        trunk: { type: array, items: { type: integer } }
        native: { type: integer }
        acl_in:
          type: string
          description: '**不支持**（与写入形状同口径，决策 #340）：该形态提交期即被拒，故本列恒空。'
        acl_out:
          type: string
          description: '**不支持**（同 acl_in，决策 #340）。'

    Vrf:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        l3_interfaces:
          type: array
          items:
            type: object
            properties:
              interface: { type: string, example: "ens2f0.100" }
              vlan: { type: integer }
              addresses: { type: array, items: { type: string } }
              acl_in:
                type: string
                description: |
                  **支持**：L3 接口的入向 ACL（唯一可用的 ACL 绑定形态）。绑定时产品**自动创建并绑定伴随
                  macip 白名单放行非 IP（含 ARP）**（决策 #341）——否则该接口会丢弃 ARP、域内主机无法解析
                  网关；IPv4/IPv6 仍走本 ACL（macip 只作用于非 IP 帧）。
        routes:
          type: array
          items: { $ref: "#/components/schemas/Route" }

    Route:
      type: object
      required: [prefix, next_hop]
      properties:
        prefix: { type: string, example: "0.0.0.0/0" }
        next_hop: { type: string }
        distance: { type: integer, default: 1 }

    Acl:
      type: object
      required: [name, rules]
      properties:
        name: { type: string }
        rules:
          type: array
          items:
            type: object
            required: [seq, action]
            properties:
              seq: { type: integer }
              direction: { type: string, enum: [ingress, egress] }
              source: { type: string, example: "10.0.0.0/8 或 any", description: "IPv4/IPv6 前缀或 any（决策 #352）：一条规则单族，any 跟随对侧家族（对侧 v6 即 ::/0），显式混族提交期拒绝" }
              destination: { type: string, description: "同 source（IPv4/IPv6 前缀或 any）" }
              protocol: { type: string, enum: [tcp, udp, icmp, any] }
              source_port: { type: string }
              destination_port: { type: string }
              action: { type: string, enum: [permit, deny] }
              hits: { type: integer, description: 运行态命中计数 }

    NatConfig:
      type: object
      description: |
        NAT44-EI 配置。V1 语义（决策 #38/#52）：action.interface 必填（VPP outside 不支持自动推断）；
        inside 转发域由 rules[].virtual_switch（须为 L3 交换机）派生，outside 转发域由出接口所属 VRF 派生
        （出接口须为某 Vrf 的 l3-interface 且已配地址）；全部规则的 virtual-switch 必须一致、出接口必须同属一个 VRF；
        VPP NAT44 单实例仅一对 inside/outside VRF（两者可同表或跨 VRF）。
      properties:
        source_pools:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              address_range: { type: string, example: "100.64.0.10 to 100.64.0.50" }
        rules:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              match_source: { type: string }
              virtual_switch: { type: string, description: "L3 交换机名（inside 转发域由 TableID(名) 派生）" }
              action:
                type: object
                properties:
                  source_pool:
                    type: string
                    description: "外部地址池（可选）；未提供时以 action.interface 的接口地址作外部地址"
                  interface:
                    type: string
                    description: "出接口（必填，决策 #38）；V1 要求其作为某 Vrf 的 l3-interface 且已配地址（outside 转发域来源）"
        static:
          type: array
          items:
            type: object
            properties:
              inside_ip: { type: string }
              outside_ip: { type: string }

    PortMirroring:
      type: object
      required: [name, source, analyzer]
      properties:
        name: { type: string }
        source:
          type: object
          properties:
            interface: { type: string }
            vnf: { type: string }
            vnf_interface: { type: string }
            direction: { type: string, enum: [ingress, egress, both] }
        analyzer: { type: string, description: 分析端口（物理口） }

    QosPolicy:
      type: object
      required: [name, cir]
      properties:
        name: { type: string }
        cir: { type: integer, description: bps }
        cbs: { type: integer, description: bytes }
        bound_interfaces:
          type: array
          items: { type: string }
          description: 引用该策略的接口名（去重；入向/出向合并）
        bindings:
          type: array
          description: "逐条方向绑定（决策 #331：同一策略可被不同接口以不同方向引用）"
          items:
            type: object
            properties:
              interface: { type: string }
              direction: { type: string, enum: [ingress, egress] }

    ResourcePool:
      type: object
      properties:
        hugepages:
          type: array
          items:
            type: object
            properties:
              page_size: { type: string, enum: ["2M", "1G"] }
              count: { type: integer, description: 配置的页数量（配置文档用）；GET 运行态视图另含 total/allocated/free }
              total: { type: integer, description: 运行态：池总页数=count }
              allocated: { type: integer, description: 运行态：已分配给 VNF 的页数（backing=normal 的 VM 不占大页池） }
              free: { type: integer, description: 运行态：空闲页数（FR-CMP-003） }
        cpu:
          type: object
          properties:
            isolated_cores:
              type: array
              items: { type: integer }
              description: 配置：隔离核全集（可与 GET 运行态共用）
            numa:
              type: array
              items:
                type: object
                properties:
                  node: { type: integer }
                  cores: { type: array, items: { type: integer } }
              description: 配置：NUMA 节点与核（FR-CMP-001 NUMA 感知）
            allocated:
              type: array
              items:
                type: object
                properties:
                  vnf: { type: string }
                  cores: { type: array, items: { type: integer } }
              description: 运行态：各 VNF 绑核分配（按 committed 配置确定性重算，FR-CMP-002/003）
            free:
              type: array
              items: { type: integer }
              description: 运行态：未被 VPP 保留核与 VNF 绑核占用的隔离核（FR-CMP-003）
            vpp_reserved:
              type: array
              items: { type: integer }
              description: 运行态：VPP main-core + corelist-workers，账本先扣、VNF 不可用（FR-SYS-010）

    VMFunction:
      type: object
      required: [name, image, vcpu, memory]
      properties:
        name: { type: string }
        description: { type: string }
        image: { type: string }
        vcpu:
          type: object
          properties:
            count: { type: integer }
            pin: { type: boolean, default: true }
            cores_assigned: { type: array, items: { type: integer }, description: 运行态实际绑核 }
        memory:
          type: object
          properties:
            size_mb: { type: integer }
            hugepage_size: { type: string, enum: ["2M", "1G"] }
            numa_node: { type: integer }
            backing: { type: string, enum: [hugepage, normal], default: hugepage, description: normal 时禁止 vhost-user vNIC }
        disks:
          type: array
          description: 附加数据盘（virtio）
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              size_gb: { type: integer, description: 空盘容量（与 image 二选一） }
              image: { type: string, description: 从 vm-image 克隆创建 }
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/VnfInterface" }
        cloud_init:
          type: object
          properties:
            user_data: { type: string }
            ssh_keys: { type: array, items: { type: string } }
            hostname: { type: string }
        serial_console: { type: boolean, default: true }
        statistics:
          type: array
          description: |
            vhost-user vNIC 的收发计数（**仅详情端点 `GET /virtual-machine-functions/{name}` 附带**；
            取自 VPP 运行态，与 CLI `show virtual-machine-functions <name> statistics` 同源，FR-CMP-011）。
            非 vhost-user vNIC 不在其中；运行态未接入时不返回（不编造）。
          items:
            type: object
            properties:
              vnic: { type: string, description: 模型里的 vNIC 名 }
              interface: { type: string, description: VPP 侧接口名 vh-<vm>-<vnic> }
              available: { type: boolean, description: 该口在 VPP 中是否取到计数 }
              rx_packets: { type: integer }
              tx_packets: { type: integer }
              rx_bytes: { type: integer }
              tx_bytes: { type: integer }
        autostart: { type: boolean }
        state: { type: string, enum: [running, shutoff, crashed, paused], description: 运行态 }

    VnfInterface:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [vhost-user, sriov-vf, memif] }
        virtual_switch: { type: string, description: sriov-vf 时仅登记 }
        mac: { type: string }
        vlan: { type: integer }
        sriov:
          type: object
          properties:
            physical_interface: { type: string }
            vf_id: { type: integer }
        state: { type: string, enum: [up, down] }

    ContainerFunction:
      type: object
      required: [name, image]
      properties:
        name: { type: string }
        description: { type: string }
        image: { type: string }
        vcpu: { type: integer }
        memory_mb: { type: integer }
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/VnfInterface" }
        env:
          type: object
          additionalProperties: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        restart_policy: { type: string, enum: [no, on-failure] }
        autostart: { type: boolean }
        state: { type: string, enum: [running, exited, dead] }

    Image:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [vm-image, container-image] }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string }
        format: { type: string, example: qcow2 }
        description: { type: string }
        imported_at: { type: string, format: date-time }
        ref_count: { type: integer, description: 引用该镜像的 VNF 数 }
        import_state: { type: string, enum: [ready, downloading, failed], description: 运行态 }
        downloaded_bytes: { type: integer, format: int64, description: 下载进度：已落盘字节（仅 URL 拉取的镜像在下载中或失败时出现） }
        total_bytes: { type: integer, format: int64, description: 下载总量；服务端未给 Content-Length 时缺省 }
        last_error: { type: string, description: 最近一次失败原因（import_state=failed 时出现，含可照做的续传指引） }
        source_tags:
          type: array
          items: { type: string }
          description: |
            容器镜像归档（docker save）内嵌的镜像 tag（如 alpine:3.20，决策 #312）。
            导入时已按仓库目录项名重打标签 `<name>:latest`，故配置里唯一可用名就是 `name`；
            本字段用于显式登记来源 tag，便于排障（归档无 tag 或未解析到 manifest.json 时**省略**，不编造）。

    Snapshot:
      type: object
      properties:
        name: { type: string }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }
        description: { type: string }

    CommittedConfig:
      type: object
      description: committed 配置读取的响应（决策 #119：整配置出口，敏感字段已脱敏）
      properties:
        configuration: { $ref: "#/components/schemas/ConfigDocument" }
        revision: { type: integer, description: 当前 committed 配置版本号 }

    CandidateView:
      type: object
      description: candidate 读取的响应（决策 #119：契约按实现的实际形状声明——此前误声明为 ConfigDocument 本体）
      properties:
        candidate: { $ref: "#/components/schemas/ConfigDocument" }
        dirty: { type: boolean, description: 相对 committed 是否有未提交变更 }

    ConfigRevision:
      type: object
      description: |
        配置提交历史条目（决策 #142；`GET /configuration/history` 的数组元素）。
        **不含配置正文**——历史快照可能含敏感字段，列表只给元数据。
      properties:
        rev: { type: integer, description: 修订号（单调递增，最新一份即当前 committed） }
        committed_at: { type: string, format: date-time, description: 提交时间（UTC） }
        user: { type: string, description: 提交者；迁移前写入的历史快照未记录提交者，为空串 }
        comment: { type: string, description: 提交说明；未填时为空串 }
        current: { type: boolean, description: 是否为当前生效的 committed 修订 }

    DiagOutput:
      type: object
      description: 诊断命令的原始回显（决策 #123；文本原样返回，客户端自行展示）
      properties:
        output: { type: string }

    ConfigCheckResult:
      type: object
      description: 仅校验的结果（决策 #122：CLI `commit check` 的 REST 等价物）
      properties:
        ok: { type: boolean, description: 校验是否全部通过 }
        errors:
          type: array
          description: 校验问题清单（ok=true 时为空数组）
          items:
            type: object
            properties:
              path: { type: string, example: "system.hostname" }
              message: { type: string, example: "主机名不合法" }

    ConfigDocument:
      type: object
      description: 整份配置文档（JSON 形式，节点与 CLI 层级一致）
      properties:
        system: { $ref: "#/components/schemas/SystemConfig" }
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/InterfaceUpdate" }
        bonds:
          type: array
          description: 链路聚合（FR-NET-017，纳入事务引擎可 compare/rollback）
          items: { $ref: "#/components/schemas/Bond" }
        virtual_switches:
          type: array
          items: { $ref: "#/components/schemas/VirtualSwitch" }
        vrfs:
          type: array
          items: { $ref: "#/components/schemas/Vrf" }
        acls:
          type: array
          items: { $ref: "#/components/schemas/Acl" }
        nat: { $ref: "#/components/schemas/NatConfig" }
        port_mirroring:
          type: array
          items: { $ref: "#/components/schemas/PortMirroring" }
        qos_policies:
          type: array
          items: { $ref: "#/components/schemas/QosPolicy" }
        resource_pools: { $ref: "#/components/schemas/ResourcePool" }
        vpp:
          $ref: "#/components/schemas/VppConfig"
          description: VPP 数据面配置（FR-SYS-008，纳入事务引擎可 compare/rollback）
        protocols:
          type: object
          description: 顶级协议层级（命令树 §2.2b）
          properties:
            lldp: { $ref: "#/components/schemas/LldpConfig" }
        virtual_machine_functions:
          type: array
          items: { $ref: "#/components/schemas/VMFunction" }
        container_functions:
          type: array
          items: { $ref: "#/components/schemas/ContainerFunction" }
        annotations:
          type: object
          description: 配置节点注释（FR-CFG-007，annotate 语句；键为语句路径，如 "system hostname"）
          additionalProperties: { type: string }

    CommitResult:
      type: object
      properties:
        committed: { type: boolean }
        revision: { type: integer, description: 配置快照编号 }
        confirmed_until: { type: string, format: date-time, description: commit confirmed 截止时间 }
        warnings:
          type: array
          items: { type: string, example: "resource-pools 变更需 reboot 生效" }

    CLIExecuteResult:
      type: object
      properties:
        output: { type: string }
        mode: { type: string, enum: [oper, config] }
        path: { type: array, items: { type: string } }
        prompt: { type: string }
        warning:
          type: boolean
          description: "本次输出是**提示**而非失败（当前唯一来源：语句未产生配置变更——值已经是目标值）。nfvis-cli 脚本模式（-c）据此继续执行后续语句而不中止；真错误不带本字段。"

    ConfigSession:
      type: object
      description: |
        candidate 会话锁持有信息（FR-CFG-009）。决策 #317：会话与身份键分离——`holder` 是展示
        用的身份键（user@source），`session_id` 是该会话的稳定标识（token 稳定 ID，决策 #301），
        `user` 是所属用户。同一用户的多个会话各占一条、不会被合并；非 super-user 只能看到/影响
        自己的会话（范围判定在服务端）。决策 #318：`dirty: false` 的持锁会话（干净锁）可被**同一用户**
        的新会话接管（跨用户不行）——接管后本表随之显示新的持锁会话。
      properties:
        holder: { type: string, example: "admin@ssh" }
        session_id:
          type: string
          example: "3ba85201-3df9-49ff-8498-b821651c1bca"
          description: 持锁会话的稳定标识（token 稳定 ID）；迁移前遗留的老锁或无持锁会话（仅在途 commit confirmed）时为空串
        user: { type: string, example: "admin", description: 会话所属用户 }
        acquired_at: { type: string, format: date-time }
        last_activity: { type: string, format: date-time }
        dirty: { type: boolean, description: 存在未提交变更 }
        confirmed_until: { type: string, format: date-time, description: 在途 commit confirmed 截止时间 }

    Alarm:
      type: object
      required: [id, severity, code, message, raised_at, state]
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, warning, error, critical] }
        code: { type: string, example: VNF_CRASHED }
        message: { type: string }
        source: { type: string, example: "virtual-machine-functions/fw-vm" }
        raised_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        state: { type: string, enum: [active, resolved] }
        time_synced:
          type: boolean
          description: |
            记录该告警（创建/重新激活）时宿主时钟是否已与 NTP 同步（NFR-006，与审计
            `AuditEntry.time_synced` 同一套三态语义）。**未同步时为 false**，据此判断
            `raised_at` 是否可信。该字段缺失表示**未知**（探针未接入），不代表已同步。

    Event:
      type: object
      properties:
        type: { type: string, enum: [alarm-raised, alarm-resolved, vnf-state-changed, image-import-progress, config-committed] }
        timestamp: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }

    AuditEntry:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        user: { type: string }
        source_ip: { type: string }
        action: { type: string, example: "config.commit / vmf.start / login" }
        detail: { type: string, description: 配置 diff 或操作参数摘要 }
        result:
          type: string
          enum: [intent, success, failure]
          description: |
            `intent` = 高危档动作执行**之前**落库的意图记录；`success` / `failure` =
            动作结束后的结果记录（决策 #150）。高危档动作两条成对（同 action、intent 在前），
            其余动作只有一条结果记录。
        time_synced:
          type: boolean
          description: |
            写入该条记录时宿主时钟是否已与 NTP 同步（NFR-006）。审计时间戳依赖 NTP，
            **未同步时为 false**，据此判断时间戳是否可信。该字段缺失表示**未知**
            （schema 迁移前写入的老记录没有这个信息），不代表已同步。
