    get:
      tags: [system]
      summary: 下载诊断归档（FR-OPS-040，read-only 可读）
      description: |
        归档里的配置是**脱敏视图**：`config.json` 按配置视图同口径摘掉 `password_hash` 等
        敏感叶子，`logs.txt` 剥掉首次启动引导打印的一次性口令（FR-SEC-007），
        故本端点**保持 read-only**——现场流程「operator 生成诊断包
        （`request system tech-support generate` 声明为 O）→ 自己下载送给支持」不被权限挡住。
        需要**可恢复**的完整配置时请用配置备份导出（`GET /system/backup/{file}`，super-user，
        且**有意**不脱敏：脱敏即无法恢复，见附录 A #143）。归档以 0600 落盘、目录 0700。
