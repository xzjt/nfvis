  /images:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [images]
      summary: 镜像列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Image" }
    post:
      tags: [images]
      summary: 导入镜像（multipart 文件上传 / JSON URL 拉取 / JSON incoming 导入，三选一）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, type, file]
              properties:
                name: { type: string }
                type: { type: string, enum: [vm-image, container-image] }
                file: { type: string, format: binary }
                description: { type: string }
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [vm-image, container-image] }
                url: { type: string, format: uri, description: HTTP(S) 拉取地址（与 incoming_file 二选一） }
                sha256: { type: string, description: "**URL 拉取时必填**：期望校验和（FR-SEC-004 默认强制）；incoming_file 导入时可省" }
                incoming_file:
                  type: string
                  description: /data/incoming 内的文件路径（先经 scp/sftp 传入；导入成功自动清理，与 url 二选一）
                description: { type: string }
      responses:
        "202":
          description: 已受理（URL 拉取异步，进度经 GET /images/{name} 的 import_state 观察；事件流随 M5）
        "201":
          description: incoming 导入完成（同步返回镜像元数据）
        "400": { $ref: "#/components/responses/Error400" }
  /images/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    get:
      tags: [images]
      summary: 镜像详情（含引用计数）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
