  /diagnostics/ping:
    post:
      tags: [system]
      summary: 经数据面做连通性测试（与 CLI `ping` 同源）
      description: |
        经 VPP 数据面 ping（**只覆盖 VPP 平面**：管理口属内核平面，请用宿主 ping），
        与 CLI `ping` 同一实现（决策 #123）。**未通即失败**（0 发包或 0 应答都报 502），
        与 CLI 的判定口径一致（附录 A #89/#93）。`ipv6=true` 显式走 v6 平面
        （`vppctl ping ipv6`，决策 #330），v4/v6 同判定口径。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
                source: { type: string, description: 源 IP（按接口地址反查接口） }
                vrf: { type: string, description: 经指定 VRF }
                count: { type: integer, description: 次数（缺省 5） }
                ipv6: { type: boolean, description: "显式 IPv6（vppctl ping ipv6；决策 #330）" }
      responses:
        "200":
          description: 已通（output 为原始回显）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagOutput" }
        "400": { $ref: "#/components/responses/Error400" }
        "502":
          description: 未通或不可用（0 发包 / 0 应答 / VPP 未装配）

  /diagnostics/traceroute:
    post:
      tags: [system]
      summary: 路径跟踪（与 CLI `traceroute` 同源）
      description: |
        宿主侧 raw ICMP/ICMPv6 路径跟踪（VPP 26.06 无 traceroute 能力）。
        `ipv6=true` 走宿主侧 ICMPv6（决策 #330）。`vrf` 对 v4/v6 **都明确拒绝**
        （宿主侧 ICMP 无法经 VPP VRF 转发，不静默降级）；要经 VRF 测 v4 连通性请用 `/diagnostics/ping`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
                vrf: { type: string, description: VRF 名；v4/v6 都不支持，非空即 502 }
                ipv6: { type: boolean, description: "宿主侧 ICMPv6（决策 #330）" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagOutput" }
        "400": { $ref: "#/components/responses/Error400" }
        "502": { description: 不可用或执行失败 }

