              schema: { $ref: "#/components/schemas/ResourcePool" }
    put:
      tags: [resource-pools]
      summary: 修改资源池（大页/隔离核变更需 reboot，响应含提示）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourcePool" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }

  /virtual-machine-functions:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [virtual-machine-functions]
      summary: VM VNF 列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VMFunction" }
    post:
      tags: [virtual-machine-functions]
      summary: 创建 VM VNF（定义；不自动启动，autostart 时启动）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VMFunction" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
        "409": { $ref: "#/components/responses/Error409" }   # 资源池配额不足
  /virtual-machine-functions/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [virtual-machine-functions]
      summary: VM 详情（资源分配/vNIC/NUMA）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VMFunction" }
    put:
      tags: [virtual-machine-functions]
      summary: 修改 VM（关机状态生效；运行中返回 409，FR-CMP-012 热调整列 V2）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VMFunction" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
        "409":
          description: VM 运行中，vCPU/内存/vNIC 修改需先关机（FR-CMP-012）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [virtual-machine-functions]
      summary: 删除 VM（级联 vNIC/VPP 端口/快照；二次确认）
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: boolean }
          description: 二次确认，必须为 true（FR-CMP-013）；缺省或 false 返回 400 CONFIRM_REQUIRED
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
  /virtual-machine-functions/{name}:start:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [virtual-machine-functions]
      summary: 启动（受理后回读域状态）
      description: |
        启动动作异步受理，但受理后会在**有界探测窗口**（缺省 3s）内回读域状态：
        一旦达到 `running` 即返回 202（正常路径语义与耗时不变）；若窗口内停在
        `paused`（如 vhost-user 初始化失败的 `paused (starting up)`）/`crashed`/`shutoff`
        一类**非预期态**，则返回 500 `VM_START_FAILED`，并在 `detail[]` 里逐条给出
        域状态与 reason、libvirt 域日志摘录（取不到则说明取不到并给出路径）与恢复建议
        （如 `request vpp restart` 后重试 start）。**不新增响应字段**——诊断经既有
        Error 形状的 `message`/`detail[]` 透出，故成功形状与既往逐字一致。

        另外，若数据面（VPP）当前不可用（未运行 / 连接不可达），会在**进入会阻塞的
        vhost-user 准备之前**即判定并返回 503 `UNAVAILABLE`（`message` 含「数据面（VPP）当前
        不可用，未启动虚拟机 <name>」与 `request vpp restart` 指引），**不产生 paused 残域**
        （决策 #314；同一判定覆盖 restart 的 off→start 分支）。该 503 复用既有 Error 形状与
        既有 `UNAVAILABLE` code，不新增响应字段。
      responses:
        "202": { description: 已受理且回读到运行态（异步完成，事件通知） }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "500":
          description: 启动后未达到运行态（paused/crashed/shutoff/absent）；detail 含域状态、libvirt 日志摘录与恢复建议
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: 数据面（VPP）当前不可用，未启动虚拟机（决策 #314）；message 含原因与 `request vpp restart` 指引
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /virtual-machine-functions/{name}:stop:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [virtual-machine-functions]
      summary: 停止（ACPI 关机，超时强杀）
      responses:
        "202": { description: 已受理 }
        "404": { $ref: "#/components/responses/Error404" }
  /virtual-machine-functions/{name}:restart:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [virtual-machine-functions]
      summary: 重启（运行中 ACPI 重启；已关机则启动）
      description: |
        运行中域走 ACPI 重启；**已关机**域的 off→start 分支与 `:start` 同路径：数据面（VPP）
        不可用时在进入会阻塞的 vhost-user 准备之前返回 503 `UNAVAILABLE`（决策 #314）。
      responses:
        "202": { description: 已受理 }
        "404": { $ref: "#/components/responses/Error404" }
        "503":
          description: 数据面（VPP）当前不可用，未启动虚拟机（仅 off→start 分支，决策 #314）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /virtual-machine-functions/{name}/console:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [virtual-machine-functions]
      summary: 申请串口 console 访问凭证（一次性 ticket，短时有效；FR-CMP-014）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ws_url: { type: string, example: "/api/v1/virtual-machine-functions/fw-vm/console/ws?ticket=..." }
                  expires_in: { type: integer, description: ticket 有效期（秒） }
        "404": { $ref: "#/components/responses/Error404" }
        "409":
          description: VM 未启用串口（serial_console=false）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /virtual-machine-functions/{name}/console/ws:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - name: ticket
        in: query
        required: true
        schema: { type: string }
        description: POST .../console 返回的一次性凭证（WebSocket 握手无法带 Bearer Token，故以 ticket 鉴权）
    get:
      tags: [virtual-machine-functions]
      summary: 串口 console WebSocket（双向透传；打开/关闭入审计，FR-OPS-032）
      responses:
        "101": { description: 协议切换为 WebSocket }
        "401": { $ref: "#/components/responses/Error401" }
  /virtual-machine-functions/{name}/snapshots:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [virtual-machine-functions]
      summary: 快照列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Snapshot" }
    post:
      tags: [virtual-machine-functions]
      summary: 创建快照（qcow2 内部快照，含全部磁盘；FR-CMP-015/018）
      description: |
        需 VM 处于关机态（running/paused/crashed 返回 409）。运行中创建内部快照会让
        qcow2 快照与活动内存不一致，回滚语义不确定；与 FR-CMP-012「关机态生效」一致。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Snapshot" }
      responses:
        "202": { description: 已受理 }
        "400": { $ref: "#/components/responses/Error400" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
  /virtual-machine-functions/{name}/snapshots/{snapshot}:rollback:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: snapshot, in: path, required: true, schema: { type: string } }
    post:
      tags: [virtual-machine-functions]
      summary: 回滚到快照（FR-CMP-015）
      description: |
        需 VM 处于关机态（running/paused/crashed 返回 409）。**实测**（决策 #75）：
        对运行中域调用 `DomainRevertToSnapshot(flags=0)` 虽返回成功且不报 libvirt 错误，
        但 libvirt 会**替换 QEMU 进程**（相当于强制重启该 VM），静默重启生产 VNF 不可接受，
        故显式拒绝并提示先关机。
      responses:
        "202": { description: 已受理 }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
  /virtual-machine-functions/{name}/snapshots/{snapshot}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: snapshot, in: path, required: true, schema: { type: string } }
    delete:
      tags: [virtual-machine-functions]
      summary: 删除快照（FR-CMP-015）
      responses:
        "200": { description: 已删除 }
        "404": { $ref: "#/components/responses/Error404" }

