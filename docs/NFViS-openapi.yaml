openapi: 3.0.3
info:
  title: NFViS REST API
  version: 1.0.0
  description: |
    NFViS 一体机 REST API（V1）。
    - 配置类写操作默认作用于 candidate，需 POST /configuration/commit 生效；
      请求头 `X-NFVIS-Auto-Commit: true` 可让单请求直接提交。
    - 错误响应统一为 Error 结构；校验错误逐条列入 detail。
    - 事件经 SSE 推送：GET /events（text/event-stream）。
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: nfvis.local
tags:
  - name: auth
  - name: system
  - name: interfaces
  - name: virtual-switches
  - name: vrfs
  - name: acls
  - name: nat
  - name: port-mirroring
  - name: qos
  - name: vpp
  - name: resource-pools
  - name: virtual-machine-functions
  - name: container-functions
  - name: images
  - name: configuration
  - name: alarms-events
  - name: audit

security:
  - bearerAuth: []

paths:
  /login:
    post:
      tags: [auth]
      summary: 登录获取 Bearer Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: token 与用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401": { $ref: "#/components/responses/Error401" }
        "423": { $ref: "#/components/responses/Error403" }   # 连续失败锁定

  /logout:
    post:
      tags: [auth]
      summary: 吊销当前 token
      responses:
        "204": { description: 已吊销 }

  /system/status:
    get:
      tags: [system]
      summary: 系统状态（uptime/CPU/内存/大页/磁盘）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }

  /system/version:
    get:
      tags: [system]
      summary: 组件版本
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }

  /vpp/restart:
    post:
      tags: [vpp]
      summary: 按 committed 配置重建 startup.conf 并重启 VPP（FR-SYS-009，super-user）
      responses:
        "202": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }

  /system/configuration/sessions:
    get:
      tags: [configuration]
      summary: candidate 持锁会话列表（FR-CFG-009，对应 show system configuration sessions）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConfigSession" }

  /system:
    put:
      tags: [system]
      summary: 修改系统配置（hostname/ntp/dns/syslog/api/management/idle-timeout）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemConfig" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
    get:
      tags: [system]
      summary: 读取系统配置
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemConfig" }

  /system/login-users:
    get:
      tags: [system]
      summary: 本地用户与 class 列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoginUser" }
    post:
      tags: [system]
      summary: 创建用户或 class
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginUser" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }

  /interfaces:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [interfaces]
      summary: 接口列表（kind=physical|management|vpp）
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [physical, management, vpp, all] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Interface" }
  /interfaces/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [interfaces]
      summary: 接口详情（含统计）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interface" }
        "404": { $ref: "#/components/responses/Error404" }
    put:
      tags: [interfaces]
      summary: 修改接口（description/mtu/enabled）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterfaceUpdate" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "404": { $ref: "#/components/responses/Error404" }

  /virtual-switches:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [virtual-switches]
      summary: 虚拟交换机列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VirtualSwitch" }
    post:
      tags: [virtual-switches]
      summary: 创建虚拟交换机
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VirtualSwitch" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
  /virtual-switches/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [virtual-switches]
      summary: 详情
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VirtualSwitch" }
        "404": { $ref: "#/components/responses/Error404" }
    delete:
      tags: [virtual-switches]
      summary: 删除（有成员引用时 409）
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }
  /virtual-switches/{name}/ports:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [virtual-switches]
      summary: 成员端口与实时状态
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VSwitchPort" }
    put:
      tags: [virtual-switches]
      summary: 全量替换成员端口列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/VSwitchPort" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
  /virtual-switches/{name}/mac-table:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [virtual-switches]
      summary: MAC 学习表（仅 L2）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    mac: { type: string }
                    port: { type: string }
                    vlan: { type: integer }

  /vrfs:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [vrfs]
      summary: VRF（L3 虚拟交换机）列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vrf" }
    post:
      tags: [vrfs]
      summary: 创建 VRF
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Vrf" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /vrfs/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [vrfs]
      summary: VRF 详情
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vrf" }
    delete:
      tags: [vrfs]
      summary: 删除 VRF
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }
  /vrfs/{name}/routes:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [vrfs]
      summary: FIB 路由表（运行态）
      description: |
        返回该 VRF 的运行态 FIB，**含 IPv4 与 IPv6**（FR-NET-013）。
        注：VPP `ip_route_dump` 不显式指定协议时只返回 IPv4，v6 须单独 dump 后合并
        （决策 #69 修复；此前 v6 静态路由已下发但此端点不可见）。
        **VRF 不在 committed 中时返回 404**（不静默回空数组——否则「VRF 不存在」会被显示成
        「无路由」；与 CLI `show vrfs <name> routes` 同口径，决策 #76④）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Route" }
        "404": { $ref: "#/components/responses/Error404" }
    put:
      tags: [vrfs]
      summary: 全量替换静态路由
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Route" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }

  /acls:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [acls]
      summary: ACL 列表（含命中计数）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Acl" }
    post:
      tags: [acls]
      summary: 创建 ACL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Acl" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /acls/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [acls]
      summary: ACL 详情
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Acl" }
    delete:
      tags: [acls]
      summary: 删除 ACL
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }

  /nat/sessions:
    get:
      tags: [nat]
      summary: NAT44 会话表（运行态，空表返回 []）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    inside_ip: { type: string }
                    inside_port: { type: integer }
                    outside_ip: { type: string }
                    outside_port: { type: integer }
                    protocol: { type: integer }
                    bytes: { type: integer, format: int64 }
                    packets: { type: integer, format: int64 }

  /nat:
    get:
      tags: [nat]
      summary: NAT 池与规则
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NatConfig" }
    put:
      tags: [nat]
      summary: 全量替换 NAT 配置
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NatConfig" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }

  /port-mirroring:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [port-mirroring]
      summary: SPAN 会话列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PortMirroring" }
    post:
      tags: [port-mirroring]
      summary: 创建 SPAN 会话
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortMirroring" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /port-mirroring/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    delete:
      tags: [port-mirroring]
      summary: 删除 SPAN 会话
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }

  /qos/policies:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [qos]
      summary: 限速策略列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QosPolicy" }
    post:
      tags: [qos]
      summary: 创建限速策略
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QosPolicy" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /qos/policies/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    delete:
      tags: [qos]
      summary: 删除策略
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }

  /resource-pools:
    get:
      tags: [resource-pools]
      summary: 资源池（总量/已分配/空闲）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourcePool" }
    put:
      tags: [resource-pools]
      summary: 修改资源池（大页/隔离核变更需 reboot，响应含提示）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourcePool" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }

  /virtual-machine-functions:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [virtual-machine-functions]
      summary: VM VNF 列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VMFunction" }
    post:
      tags: [virtual-machine-functions]
      summary: 创建 VM VNF（定义；不自动启动，autostart 时启动）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VMFunction" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
        "409": { $ref: "#/components/responses/Error409" }   # 资源池配额不足
  /virtual-machine-functions/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [virtual-machine-functions]
      summary: VM 详情（资源分配/vNIC/NUMA）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VMFunction" }
    put:
      tags: [virtual-machine-functions]
      summary: 修改 VM（关机状态生效；运行中返回 409，FR-CMP-012 热调整列 V2）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VMFunction" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
        "409":
          description: VM 运行中，vCPU/内存/vNIC 修改需先关机（FR-CMP-012）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [virtual-machine-functions]
      summary: 删除 VM（级联 vNIC/VPP 端口/快照；二次确认）
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: boolean }
          description: 二次确认，必须为 true（FR-CMP-013）；缺省或 false 返回 400 CONFIRM_REQUIRED
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
  /virtual-machine-functions/{name}:start:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [virtual-machine-functions]
      summary: 启动
      responses:
        "202": { description: 已受理（异步完成，事件通知） }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
  /virtual-machine-functions/{name}:stop:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [virtual-machine-functions]
      summary: 停止（ACPI 关机，超时强杀）
      responses:
        "202": { description: 已受理 }
        "404": { $ref: "#/components/responses/Error404" }
  /virtual-machine-functions/{name}:restart:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [virtual-machine-functions]
      summary: 重启（运行中 ACPI 重启；已关机则启动）
      responses:
        "202": { description: 已受理 }
        "404": { $ref: "#/components/responses/Error404" }
  /virtual-machine-functions/{name}/console:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [virtual-machine-functions]
      summary: 申请串口 console 访问凭证（一次性 ticket，短时有效；FR-CMP-014）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ws_url: { type: string, example: "/api/v1/virtual-machine-functions/fw-vm/console/ws?ticket=..." }
                  expires_in: { type: integer, description: ticket 有效期（秒） }
        "404": { $ref: "#/components/responses/Error404" }
        "409":
          description: VM 未启用串口（serial_console=false）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /virtual-machine-functions/{name}/console/ws:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - name: ticket
        in: query
        required: true
        schema: { type: string }
        description: POST .../console 返回的一次性凭证（WebSocket 握手无法带 Bearer Token，故以 ticket 鉴权）
    get:
      tags: [virtual-machine-functions]
      summary: 串口 console WebSocket（双向透传；打开/关闭入审计，FR-OPS-032）
      responses:
        "101": { description: 协议切换为 WebSocket }
        "401": { $ref: "#/components/responses/Error401" }
  /virtual-machine-functions/{name}/snapshots:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [virtual-machine-functions]
      summary: 快照列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Snapshot" }
    post:
      tags: [virtual-machine-functions]
      summary: 创建快照（qcow2 内部快照，含全部磁盘；FR-CMP-015/018）
      description: |
        需 VM 处于关机态（running/paused/crashed 返回 409）。运行中创建内部快照会让
        qcow2 快照与活动内存不一致，回滚语义不确定；与 FR-CMP-012「关机态生效」一致。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Snapshot" }
      responses:
        "202": { description: 已受理 }
        "400": { $ref: "#/components/responses/Error400" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
  /virtual-machine-functions/{name}/snapshots/{snapshot}:rollback:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: snapshot, in: path, required: true, schema: { type: string } }
    post:
      tags: [virtual-machine-functions]
      summary: 回滚到快照（FR-CMP-015）
      description: |
        需 VM 处于关机态（running/paused/crashed 返回 409）。**实测**（决策 #75）：
        对运行中域调用 `DomainRevertToSnapshot(flags=0)` 虽返回成功且不报 libvirt 错误，
        但 libvirt 会**替换 QEMU 进程**（相当于强制重启该 VM），静默重启生产 VNF 不可接受，
        故显式拒绝并提示先关机。
      responses:
        "202": { description: 已受理 }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
  /virtual-machine-functions/{name}/snapshots/{snapshot}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: snapshot, in: path, required: true, schema: { type: string } }
    delete:
      tags: [virtual-machine-functions]
      summary: 删除快照（FR-CMP-015）
      responses:
        "200": { description: 已删除 }
        "404": { $ref: "#/components/responses/Error404" }

  /container-functions:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [container-functions]
      summary: 容器 VNF 列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContainerFunction" }
    post:
      tags: [container-functions]
      summary: 创建容器 VNF
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContainerFunction" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /container-functions/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    get:
      tags: [container-functions]
      summary: 容器详情
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerFunction" }
    delete:
      tags: [container-functions]
      summary: 删除容器（二次确认）
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: boolean }
          description: 二次确认，必须为 true（FR-CMP-021）；缺省或 false 返回 400 CONFIRM_REQUIRED
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
  /container-functions/{name}:start:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [container-functions]
      summary: 启动
      responses: { "202": { description: 已受理 } }
  /container-functions/{name}:restart:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [container-functions]
      summary: 重启
      responses: { "202": { description: 已受理 } }
  /container-functions/{name}:stop:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [container-functions]
      summary: 停止
      responses: { "202": { description: 已受理 } }
  /container-functions/{name}/logs:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: last, in: query, schema: { type: integer, default: 100 } }
    get:
      tags: [container-functions]
      summary: 容器日志
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string }

  /images:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [images]
      summary: 镜像列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Image" }
    post:
      tags: [images]
      summary: 导入镜像（multipart 文件上传 / JSON URL 拉取 / JSON incoming 导入，三选一）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, type, file]
              properties:
                name: { type: string }
                type: { type: string, enum: [vm-image, container-image] }
                file: { type: string, format: binary }
                description: { type: string }
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [vm-image, container-image] }
                url: { type: string, format: uri, description: HTTP(S) 拉取地址（与 incoming_file 二选一） }
                sha256: { type: string, description: "**URL 拉取时必填**：期望校验和（FR-SEC-004 默认强制）；incoming_file 导入时可省" }
                incoming_file:
                  type: string
                  description: /data/incoming 内的文件路径（先经 scp/sftp 传入；导入成功自动清理，与 url 二选一）
                description: { type: string }
      responses:
        "202":
          description: 已受理（URL 拉取异步，进度经 GET /images/{name} 的 import_state 观察；事件流随 M5）
        "201":
          description: incoming 导入完成（同步返回镜像元数据）
        "400": { $ref: "#/components/responses/Error400" }
  /images/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    get:
      tags: [images]
      summary: 镜像详情（含引用计数）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
    delete:
      tags: [images]
      summary: 删除镜像（被引用时 409）
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }

  /configuration:
    get:
      tags: [configuration]
      summary: 读取 committed 配置（全量，敏感字段已脱敏）
      description: |
        返回当前生效配置的整份文档与版本号。此前只有分段读取（`GET /system`、`GET /vpp/config`
        等配置段），没有整配置出口——CLI 的 `show configuration` 因此没有 REST 等价物
        （round42 覆盖核查的缺口 #1，增量 2 的阻塞项，决策 #119）。敏感字段（口令哈希等）
        与 candidate 读取同样脱敏（FR-SEC-007）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommittedConfig" }

  /configuration/candidate:
    get:
      tags: [configuration]
      summary: 读取当前会话 candidate
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateView" }
    put:
      tags: [configuration]
      summary: 写 candidate（override 或 merge）
      description: |
        两种语义：缺省 = **override**（整体替换，等价 CLI `load override`）；
        请求头 `X-NFVIS-Merge: true` = **merge**（按字段合并，等价 CLI `load merge`）——
        只覆盖文档里出现的字段，未出现的保持不动（`model.Merge` 语义）。
        200 响应的 `candidate` 是**合并后**的结果（merge 时与请求体不同）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigDocument" }
      responses:
        "200":
          description: |
            candidate 已更新（未提交）。缺省分支返回 `CandidateView`（`candidate` 为替换/合并后的文档）；
            带 `X-NFVIS-Auto-Commit: true` 时走提交分支、返回 `CommitResult`（两种形状，
            故此处不声明 schema——形状守护覆盖的是 GET 分支）。
    delete:
      tags: [configuration]
      summary: 丢弃 candidate（discard）
      responses:
        "204": { description: 已丢弃 }
  /configuration/commit:
    post:
      tags: [configuration]
      summary: 提交 candidate（含校验+下发底座）
      description: |
        管理口地址/网关变更须以 commit confirmed 提交（`confirmed_minutes > 0`）：
        凡**经网络接入**的会话（SSH、REST/Web 控制台）都受此约束（FR-CFG-012，决策 #121），
        本地串口豁免；未带 `confirmed_minutes` 时返回 400 `CONFIRM_REQUIRED`。
        确认期内未调用 `POST /configuration/commit:confirm` 将自动回滚。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed_minutes: { type: integer, description: "大于 0 时为 commit confirmed" }
                message: { type: string }
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "400":
          description: |
            校验失败（detail 列出全部错误）；或管理口变更未走 commit confirmed
            （code=CONFIRM_REQUIRED）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Error409" }
  /configuration/commit:confirm:
    post:
      tags: [configuration]
      summary: 确认 commit confirmed
      responses:
        "200": { description: 已确认 }
  /configuration/diff:
    get:
      tags: [configuration]
      summary: candidate ⇄ committed 差异
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string }
  /configuration/check:
    post:
      tags: [configuration]
      summary: 仅校验 candidate 不下发（CLI `commit check` 的 REST 等价物）
      description: |
        运行与提交相同的全部校验（schema + 语义 + 镜像存在性等）但**不落库、不下发底座**，
        供控制台在提交前预校验（round42 覆盖核查缺口 #10，决策 #122）。
        需要持有 candidate 会话（与 commit 相同）；校验发现问题时仍返回 200——
        检查本身是成功的，结果在 `ok` 与 `errors` 里。
      responses:
        "200":
          description: 校验完成（ok=false 时 errors 列出全部问题）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigCheckResult" }
        "409": { $ref: "#/components/responses/Error409" }
  /configuration/history:
    get:
      tags: [configuration]
      summary: 配置提交历史（rev/时间/用户/注释，最新在前）
      description: |
        列出保留的 committed 历史快照的**元数据**（决策 #142）：CLI 有 `rollback [n]` 与
        `show configuration compare rollback <n>`，但此前没有「列出历史快照」的读物——
        控制台的配置历史页（`#/config/history`）需要「rev → 时间/用户/注释」的列表，
        操作者据此先看差异再回滚。
        权限与 `GET /configuration` 同口径（ClassReadOnly，命令树路径 `show configuration history`）。
        **只回元数据、不回配置正文**（FR-SEC-007：历史快照里可能含口令哈希等敏感字段，
        列表不需要它们，故不脱敏也不外发）；`user` 对迁移前写入的历史快照为空串——
        当时未记录提交者，宁可空着也不编造。
      responses:
        "200":
          description: OK（无历史时为空数组）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConfigRevision" }
  /configuration/rollback/{n}:
    parameters: [{ name: n, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 50 } }]
    post:
      tags: [configuration]
      summary: 取第 n 个历史快照为 candidate（需再 commit）
      responses:
        "200": { description: candidate 已替换为历史快照 }
        "404": { $ref: "#/components/responses/Error404" }

  /cli/execute:
    post:
      tags: [configuration]
      x-internal: true
      summary: 执行一行 CLI 命令（cli_bridge，仅 nfvis-cli 使用，不承诺第三方兼容）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line]
              properties:
                line: { type: string, description: CLI 命令行（不含管道时逐字执行） }
                source: { type: string, enum: [ssh, console], description: 接入源（影响 FR-CFG-012 自锁判定） }
      responses:
        "200":
          description: 执行结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CLIExecuteResult" }
        "400": { $ref: "#/components/responses/Error400" }

  /cli/candidates:
    get:
      tags: [configuration]
      x-internal: true
      summary: CLI ?/Tab 补全候选（仅 nfvis-cli 使用）
      parameters:
        - { name: tokens, in: query, schema: { type: string }, description: 已完成 token（逗号分隔） }
        - { name: partial, in: query, schema: { type: string }, description: 正在输入的前缀 }
        - { name: kind, in: query, schema: { type: string }, description: "清单模式（动态候选来源）。接口名一族分三种（决策 #83，来源不同）：vpp-ifnames=VPP 中的接口/已被 DPDK 接管的数据面端口；kernel-ifnames=内核网卡/未被接管的物理口（管理口、bind-dpdk、SR-IOV PF 用）；ifnames=两者并集（动作混合的 request interfaces <n> 用）。其余：vmnames/vswitches/vrfs/ctnames/images/classes/revisions/vppplugins/acls/qos-policies" }
      responses:
        "200":
          description: 候选列表（token/desc 对，或 kind 模式下的字符串清单）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Token: { type: string }
                    Desc: { type: string }

  /alarms:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [alarms-events]
      summary: 告警列表（state=active|resolved|all）
      parameters: [{ name: state, in: query, schema: { type: string, enum: [active, resolved, all], default: active } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alarm" }
  /events:
    get:
      tags: [alarms-events]
      summary: 事件流（SSE）
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }

  /audit-logs:
    get:
      tags: [audit]
      summary: 审计日志（分页）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: user, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  /metrics:
    get:
      tags: [system]
      summary: Prometheus 指标
      security: []
      responses:
        "200":
          description: text/plain; version=0.0.4
          content:
            text/plain:
              schema: { type: string }

  /ui:
    get:
      tags: [system]
      summary: Web 控制面入口（重定向到 /ui/）
      description: |
        决策 #115：V2 Web 控制面增量 1（只读总览）内嵌进 nfvisd 并**同源**托管。
        本路径只做跳转到 `/ui/`，免得操作者少打一个斜杠拿到 404。
        无鉴权：静态资源不含敏感信息，且登录页必须先能加载。
      security: []
      responses:
        "302":
          description: 跳转到 /ui/
          headers:
            Location: { schema: { type: string } }

  /ui/:
    get:
      tags: [system]
      summary: Web 控制面静态资源（index.html / app.js / style.css）
      description: |
        决策 #115：内嵌进二进制的免构建前端（原生 HTML/CSS/JS，无 npm）。
        数据不从这里取——页面经既有 REST 端点 + `Authorization: Bearer` 读取，
        实时刷新用 `GET /events`（SSE）；token 存浏览器 sessionStorage，关标签页即失效。
        无鉴权（与 /metrics、/openapi.json 同例）。
      security: []
      responses:
        "200":
          description: 静态资源（按扩展名返回 text/html、text/javascript、text/css）
          content:
            text/html:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/Error404"

  /openapi.json:
    get:
      tags: [system]
      summary: 本规范（OpenAPI 3.0 文档，随产品发布的运行时副本）
      description: |
        FR-API-002：Web 控制面据此开发。内容为随二进制嵌入的本规范 JSON，
        与 `docs/NFViS-openapi.yaml` 同源（由 `make docscheck` 守护一致性）。
        无鉴权（与 /metrics 同）：该文档亦随 deb 安装于 `/usr/share/doc/nfvis/`，不含敏感信息。
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, description: OpenAPI 3.0 文档 }

  /vpp/status:
    get:
      tags: [system]
      summary: VPP 数据面状态（版本、线程/worker、buffer、内存、配置版本）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VppStatus" }
  /vpp/config:
    get:
      tags: [system]
      summary: 读取 VPP 数据面配置（startup.conf 生成源）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VppConfig" }
    put:
      tags: [system]
      summary: 修改 VPP 配置（cpu/memory/dpdk 变更需重启数据面生效）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VppConfig" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
  /vpp/capture:
    get:
      tags: [system]
      summary: 抓包会话状态与已导出 pcap 清单（单会话；导出文件落 /var/lib/nfvis/captures）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureStatus" }
    post:
      tags: [system]
      summary: 开始数据面抓包（达到 count 自动停止）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interface]
              properties:
                interface: { type: string }
                count:
                  type: integer
                  default: 1000
                  description: |
                    VPP 抓包缓冲深度（环形，超出丢最旧）。注意：VPP 26.06 的 pcap trace 以
                    max_packets 作为缓冲深度且无“已抓包计数”接口，故非“达到 count 自动停止”；
                    需显式 stop/export（契约语义按实测调整，见附录 A #59）。
                filter_acl:
                  type: string
                  description: "V1 不支持：VPP 26.06 pcap trace 无 ACL 过滤（仅支持按 error），非空返回 400"
      responses:
        "202": { description: 已开始 }
        "409": { $ref: "#/components/responses/Error409" }   # 已有会话进行中
    delete:
      tags: [system]
      summary: 停止抓包（`?export=true` 时同时导出 pcap）
      description: |
        缺省只停止（丢弃缓冲）；`?export=true` 表示**停止并导出**——与 CLI
        `request vpp trace export` 同义（此前只有 CLI 能导出，REST 侧无法表达，界面因此接不上）。
      parameters:
        - name: export
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: true = 停止并导出 pcap 到 /var/lib/nfvis/captures
      responses:
        "204": { description: 已停止（未导出） }
        "200":
          description: 已停止并导出（返回导出的文件）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureFile" }
  /vpp/capture/{file}:
    parameters: [{ name: file, in: path, required: true, schema: { type: string } }]
    get:
      tags: [system]
      summary: 下载 pcap 文件
      responses:
        "200":
          description: application/octet-stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /bonds:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [interfaces]
      summary: 链路聚合列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bond" }
    post:
      tags: [interfaces]
      summary: 创建 bond
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Bond" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /bonds/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    get:
      tags: [interfaces]
      summary: bond 详情（含 LACP actor/partner 状态）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bond" }
    delete:
      tags: [interfaces]
      summary: 删除 bond（被引用时 409）
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }

  /system:reboot:
    post:
      tags: [system]
      summary: 重启系统
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean, description: 必须为 true }
      responses:
        "202": { description: 已受理 }
        "400": { $ref: "#/components/responses/Error400" }
  /system:shutdown:
    post:
      tags: [system]
      summary: 关机（或 poweroff）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean, description: 必须为 true }
      responses:
        "202": { description: 已受理 }
        "400": { $ref: "#/components/responses/Error400" }
  /system:zeroize:
    post:
      tags: [system]
      summary: 恢复出厂（清空数据分区配置/镜像/VNF 并重置账号，FR-OPS-007）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, description: 双重确认，必须为 true }
      responses:
        "202": { description: 已受理，重启后进入初始化状态 }
        "400": { $ref: "#/components/responses/Error400" }
  /system/software:
    post:
      tags: [system]
      summary: 安装 nfvis 软件包（deb 路径或 URL，校验→升级→重启 nfvisd→报告）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package]
              properties:
                package: { type: string, description: 本地路径或 https URL }
                sha256: { type: string }
      responses:
        "202": { description: 已受理（异步，事件通知结果） }
        "400": { $ref: "#/components/responses/Error400" }
  /system/software:rollback:
    post:
      tags: [system]
      summary: 回退到上一版本
      responses:
        "202": { description: 已受理 }
  /system/ntp:sync:
    post:
      tags: [system]
      summary: 立即触发一次 NTP 同步
      responses:
        "200": { description: 已触发 }
  /system/kernel:
    get:
      tags: [system]
      summary: 内核启动基线三方对照（cmdline / 运行实际 / 配置期望 + 差异）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KernelBaseline" }
  /system/kernel:apply:
    post:
      tags: [system]
      summary: 按 committed 配置写入 GRUB 基线（需重启生效，FR-SYS-014）
      responses:
        "200": { description: 已写入（响应含 backup 路径与 pending_reboot 差异） }
        "400": { $ref: "#/components/responses/Error400" }
  /system/kernel:rollback:
    post:
      tags: [system]
      summary: 回退上一次内核基线（需重启生效）
      responses:
        "200": { description: 已回退 }

  /system/health/thresholds:
    get:
      tags: [system]
      summary: 硬件健康告警阈值
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthThresholds" }
    put:
      tags: [system]
      summary: 修改硬件健康告警阈值
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealthThresholds" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }

  /protocols/lldp:
    get:
      tags: [interfaces]
      summary: LLDP 全局配置
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LldpConfig" }
    put:
      tags: [interfaces]
      summary: 修改 LLDP 配置
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LldpConfig" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
  /protocols/lldp/neighbors:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [interfaces]
      summary: LLDP 邻居表（运行态）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    local_interface: { type: string }
                    chassis_id: { type: string, description: "按 subtype 解码；MAC 型（chassis=4）格式化为 aa:bb:cc:dd:ee:ff（决策 #70）" }
                    port_id: { type: string, description: "按 subtype 解码；MAC 型（port=3）格式化为 aa:bb:cc:dd:ee:ff" }
                    ttl: { type: integer }

  /system/hardware:
    get:
      tags: [system]
      summary: 硬件健康（温度/风扇/电源/SMART）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HardwareHealth" }

  /system/tls:
    get:
      tags: [system]
      summary: 当前 API 证书信息（subject/issuer/有效期）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TlsInfo" }
    put:
      tags: [system]
      summary: 安装外部证书（PEM 文本），立即生效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate, key]
              properties:
                certificate: { type: string }
                key: { type: string, format: password }
      responses:
        "200": { description: 已生效 }
        "400": { $ref: "#/components/responses/Error400" }
  /system/tls:regenerate:
    post:
      tags: [system]
      summary: 重签自签证书
      responses:
        "200": { description: 已重签 }

  /system/core-dumps:export:
    post:
      tags: [system]
      summary: 导出 core dump 清单到 URL（宿主操作）
      description: |
        与 CLI `request system core-dumps export <url>` 同一实现：把转储**清单**（JSON：
        hostname / exported_at / core_dumps[]）POST 到目标 URL。**只导出清单**——转储本体
        动辄数 GB，经 `GET /system/core-dumps/{file}` 另取。目标须为 http/https；
        **目标不可达或非 2xx 即失败**（不谎报成功）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: 目标地址（http/https） }
      responses:
        "200":
          description: 已导出
          content:
            application/json:
              schema:
                type: object
                properties:
                  exported: { type: integer, description: 导出的转储条数 }
                  url: { type: string }
                  status: { type: integer, description: 目标端返回的 HTTP 状态 }
                  message: { type: string }

  /system/ssh-host-key:regenerate:
    post:
      tags: [system]
      summary: 重新生成 SSH host key（宿主 sshd）
      description: |
        与 CLI `request system ssh host-key regenerate` 同一实现（FR-SYS-011）：删除
        `/etc/ssh/ssh_host_*` 私钥后跑 `ssh-keygen -A` 重建。**影响的是新连接的 host key 校验**
        （客户端 known_hosts 会失配，需按提示更新），当前已建立的会话不受影响。
      responses:
        "200":
          description: 已重新生成
          content:
            application/json:
              schema:
                type: object
                properties:
                  regenerated: { type: boolean }
                  message: { type: string, description: 操作者可见的结果说明 }

  /alarms:clear:
    post:
      tags: [alarms-events]
      summary: 清除已 resolved 告警（all 或指定 id）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                all: { type: boolean }
      responses:
        "204": { description: 已清除 }

  /system/backup:
    get:
      tags: [system]
      summary: 配置备份归档列表（只回文件名/大小/时间元数据，read-only 可读）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupArchive" }
    post:
      tags: [system]
      summary: 生成配置备份归档（FR-OPS-004，super-user）
      responses:
        "202":
          description: 已生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupArchive" }
  /system/backup/{file}:
    parameters: [{ name: file, in: path, required: true, schema: { type: string } }]
    get:
      tags: [system]
      summary: 下载备份归档（FR-OPS-004，super-user）
      description: |
        归档是**完整 committed 配置**（含本地用户口令哈希），恢复账号所必需——故**不脱敏**
        （脱敏即无法恢复），属**权限**问题不是脱敏问题。按 FR-SEC-007 的既有例外口径
        （0600、仅 super-user，见附录 A #70）与生成端 `POST /system/backup` 同级，
        本端点自决策 #143 起要求 super-user（此前为 read-only）。
      responses:
        "200":
          description: application/octet-stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error403" }
  /system/restore:
    post:
      tags: [system]
      summary: 从备份归档恢复（导入为 candidate 并提交）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }

  /system/logs:
    get:
      tags: [system]
      summary: 服务端日志尾部（与 CLI `show log system` 同源）
      description: |
        返回服务端日志的尾部文本（systemd 单元优先，其次系统日志），与 CLI 的
        `show log system` 取同一来源（决策 #123：round42 覆盖核查缺口 #2 的 REST 出口）。
        文本原样返回，客户端自行按行处理（`?last=<n>` 只取末尾 n 行）。
      parameters:
        - { name: last, in: query, schema: { type: integer, minimum: 1 }, description: 只取末尾 N 行 }
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string }
        "503": { description: 未接入（编排器未装配对应运行时） }

  /diagnostics/ping:
    post:
      tags: [system]
      summary: 经数据面做连通性测试（与 CLI `ping` 同源）
      description: |
        经 VPP 数据面 ping（**只覆盖 VPP 平面**：管理口属内核平面，请用宿主 ping），
        与 CLI `ping` 同一实现（决策 #123）。**未通即失败**（0 发包或 0 应答都报 502），
        与 CLI 的判定口径一致（附录 A #89/#93）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
                source: { type: string, description: 源 IP（按接口地址反查接口） }
                vrf: { type: string, description: 经指定 VRF }
                count: { type: integer, description: 次数（缺省 5） }
      responses:
        "200":
          description: 已通（output 为原始回显）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagOutput" }
        "400": { $ref: "#/components/responses/Error400" }
        "502":
          description: 未通或不可用（0 发包 / 0 应答 / VPP 未装配）

  /diagnostics/traceroute:
    post:
      tags: [system]
      summary: 路径跟踪（与 CLI `traceroute` 同源）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
                vrf: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagOutput" }
        "400": { $ref: "#/components/responses/Error400" }
        "502": { description: 不可用或执行失败 }

  /interfaces:clear-statistics:
    post:
      tags: [interfaces]
      summary: 清零接口统计计数（与 CLI `clear interfaces statistics` 同源）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: 接口名；缺省为全部 } 
      responses:
        "204": { description: 已清零 }
        "400": { $ref: "#/components/responses/Error400" }
        "503": { description: 未接入（编排器未装配对应运行时） }

  /system/tech-support:
    get:
      tags: [system]
      summary: 诊断归档列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupArchive" }
    post:
      tags: [system]
      summary: 生成诊断归档（版本/配置/日志/审计/状态/core dump 清单）
      responses:
        "202":
          description: 已生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupArchive" }
  /system/tech-support/{file}:
    parameters: [{ name: file, in: path, required: true, schema: { type: string } }]
    get:
      tags: [system]
      summary: 下载诊断归档
      responses:
        "200":
          description: application/octet-stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /system/core-dumps:
    get:
      tags: [system]
      summary: 崩溃转储清单
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CoreDump" }
    delete:
      tags: [system]
      summary: 删除转储（file 缺省为全部）
      parameters: [{ name: file, in: query, schema: { type: string } }]
      responses:
        "204": { description: 已删除 }

  /interfaces/{name}/sriov:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    put:
      tags: [interfaces]
      summary: 设置 VF 数量（创建/回收 VF）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vf_count]
              properties:
                vf_count: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }

  /interfaces/{name}/dpdk:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: |
          接口名**或 PCI 地址**（如 0000:13:00.0）。已被 DPDK 接管的网卡在内核中无 netdev，
          此时只能按 PCI 定位——而这正是解绑的常态。
    put:
      tags: [interfaces]
      summary: 网卡 DPDK 驱动接管/解绑（FR-NET-001）
      description: |
        把物理网卡绑定到 DPDK 用户态驱动（缺省 vfio-pci）或解绑交还内核驱动。
        实现为 sysfs 标准流程（`driver_override` + `bind`/`unbind`）；
        绑定会**中断该网卡现有流量**，且该网卡不得正被 VPP 使用，故需 `confirm=true`。
        先前该能力在产品内完全缺失，实机需人工/安装期带外完成（决策 #72）。
      parameters:
        - { name: confirm, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bound]
              properties:
                bound: { type: boolean, description: true = 绑定到 DPDK 驱动；false = 解绑交还内核 }
                uio_driver: { type: string, enum: [vfio-pci, igb-uio], description: 绑定语义下缺省 vfio-pci }
                to_driver:
                  type: string
                  description: |
                    解绑语义（bound=false）下交还的内核驱动名。实测 nfvis-vm（内核 6.x + vfio-pci）：
                    仅清空 driver_override 并 rescan **不足以**让内核重新探测原生驱动，
                    建议显式给出（如 vmxnet3）；未给出且未自动绑定时返回可操作错误。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  interface: { type: string }
                  pci: { type: string }
                  driver: { type: string, description: 操作后该网卡绑定的驱动 }
        "400": { $ref: "#/components/responses/Error400" }
        "404": { $ref: "#/components/responses/Error404" }

  /system/login-users/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    put:
      tags: [system]
      summary: 修改用户（class/口令，需 super-user）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                class: { type: string }
                password: { type: string, format: password }
      responses:
        "200": { description: 已更新（入审计） }
    delete:
      tags: [system]
      summary: 删除用户
      responses:
        "204": { description: 已删除 }
        "409": { $ref: "#/components/responses/Error409" }   # 不能删除自己/最后一个 super-user
  /system/login-users/{name}:change-password:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [auth]
      summary: 口令自助修改（登录者本人或 super-user，需旧口令）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        "200": { description: 已修改（入审计） }
        "403": { $ref: "#/components/responses/Error403" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: nfvis-token

  responses:
    ConfigAccepted:
      description: "已写入 candidate（无 Auto-Commit 头）或已提交生效（带 X-NFVIS-Auto-Commit: true）"
      headers:
        X-NFVIS-Committed:
          schema: { type: boolean }
          description: true 表示本次请求已直接提交
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommitResult" }
    Error400: { description: 校验失败, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Error401: { description: 未认证, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Error403: { description: 无权限或账号锁定, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Error404: { description: 资源不存在, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Error409: { description: 冲突（引用存在/配额不足/会话锁占用）, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string }
        detail:
          type: array
          items:
            type: object
            properties:
              path: { type: string, example: "virtual-machine-functions[fw-vm].memory.size-mb" }
              message: { type: string, example: "资源池大页 1G 不足：需要 8，空闲 2" }

    LoginResponse:
      type: object
      properties:
        token: { type: string }
        token_id: { type: string }
        user: { $ref: "#/components/schemas/LoginUser" }
        expires_in: { type: integer }

    LoginUser:
      type: object
      required: [name]
      properties:
        name: { type: string }
        class: { type: string, example: super-user }
        kind: { type: string, enum: [user, class], description: 区分用户与 class 定义 }

    SystemStatus:
      type: object
      description: |
        系统状态摘要。数据源与 CLI 的 `show system uptime|cpu|memory|storage` **同源**
        （`internal/metrics.HostMetrics()`，Linux 采集），`hugepages` 与 `/resource-pools` 同源。
      properties:
        hostname: { type: string }
        uptime_seconds: { type: integer, description: 主机运行时长（/proc/uptime，与 CLI `show system uptime` 同源；非 Linux 取不到时退回守护进程运行时长） }
        config_ready: { type: boolean, description: 配置库可用（已建库且可读 committed） }
        cpu:
          type: object
          properties:
            total: { type: integer, description: 在线核数 }
            isolated: { type: array, items: { type: integer }, description: 隔离核（取自资源池配置） }
            usage_percent: { type: number, description: 整机使用率（0-100） }
        memory:
          type: object
          properties:
            total_mb: { type: integer }
            used_mb: { type: integer, description: total - available }
        hugepages:
          type: array
          description: 各页大小的池用量（与 `/resource-pools.hugepages` 同源；产品有 1G/2M 两个池）
          items:
            type: object
            properties:
              page_size: { type: string, enum: [1G, 2M] }
              total: { type: integer }
              allocated: { type: integer }
              free: { type: integer }
        storage:
          type: object
          description: 根文件系统（与 CLI `show system storage` 同源）
          properties:
            total_bytes: { type: integer, format: int64 }
            free_bytes: { type: integer, format: int64 }
            used_ratio: { type: number, description: 已用比例（0-1） }

    VersionInfo:
      type: object
      description: |
        组件版本汇总（FR-SYS-007）。探测不到的键**缺席**（不编造空串）：ubuntu 读
        /etc/os-release（非 Linux 无该文件时缺席）；vpp 与 `/vpp/status` 同源（VPP 未接入
        或未连接时缺席）；libvirt/qemu/docker 经底座命令探测（未安装、守护进程未运行或
        不在 PATH 时缺席）；dpdk 没有可靠版本来源（随 VPP 静态链接、VPP binary API 的
        show_version 不含、运行进程无独立 DPDK 库可读），有意不汇报。
      properties:
        nfvis: { type: string, example: "1.0.0" }
        ubuntu: { type: string, example: "26.04 LTS" }
        vpp: { type: string, example: "26.06" }
        dpdk: { type: string }
        libvirt: { type: string }
        qemu: { type: string }
        docker: { type: string }

    VppStatus:
      type: object
      description: VPP 数据面状态（FR-SYS-007 版本锁定、FR-SYS-009 pending-restart、运行态线程）
      properties:
        version: { type: string, example: "26.06-release", description: 探测到的 VPP 版本 }
        connected: { type: boolean, description: 当前是否已连接 }
        config_revision: { type: integer, description: 当前 committed 配置版本（供判断数据面是否落后于配置） }
        pending_restart:
          type: boolean
          description: committed vpp 段与已应用 startup.conf 不一致（需 request vpp restart）
        last_error: { type: string, description: 最近一次连接错误（无则省略） }
        threads:
          type: array
          description: 数据面线程（VPP show_threads；未连接时省略）
          items: { $ref: "#/components/schemas/VppThread" }
        buffers:
          type: array
          description: |
            buffer 池用量。来源见 `buffers_source`；不可用时**省略数组但须给出
            `buffers_unavailable` 原因**（不静默省略，决策 #68）。
          items:
            type: object
            properties:
              name: { type: string }
              used: { type: number }
              available: { type: number }
              cached: { type: number }
        buffers_source:
          type: string
          enum: [statsclient, vpp_get_stats]
          description: |
            buffer 池统计来源。`statsclient` = govpp stats segment 解码；
            `vpp_get_stats` = statsclient 解码失败或全零时回退 VPP 自带同版本工具
            （VPP 26.06 的 buffer 池值类型 govpp v0.13.0 无法解码，决策 #68）。无数据时省略。
        buffers_unavailable:
          type: string
          description: buffer 池统计不可用的原因（有数据时省略；决策 #68）
        memory:
          type: object
          description: main heap 内存合计（stats segment；不可用时省略）
          properties:
            total: { type: integer, format: int64 }
            used: { type: integer, format: int64 }
            free: { type: integer, format: int64 }

    VppThread:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: vpp_main }
        type: { type: string, example: workers }
        core: { type: integer, description: 绑核（CPU） }

    SystemConfig:
      type: object
      properties:
        hostname: { type: string }
        timezone: { type: string, example: "Asia/Shanghai" }
        ntp:
          type: array
          items:
            type: object
            properties:
              server: { type: string }
              prefer: { type: boolean }
        dns_servers: { type: array, items: { type: string } }
        management:
          type: object
          description: |
            管理口（独立管理网卡，内核驱动，**不得用于数据面**，FR-NET-002/FR-SEC-001）。
            指定 `interface` 后，commit 校验会拒绝该网卡出现在 `vpp.dpdk.dev`、
            bond 成员、虚拟交换机端口、L3 接口等任何数据面引用中（决策 #71）。
          properties:
            interface: { type: string, description: "管理网卡名（如 ens160）；须保留内核驱动", example: "ens160" }
            address: { type: string, example: "192.168.1.10/24" }
            gateway: { type: string }
        login:
          type: object
          description: 本地用户与 login class（FR-SEC-002/003；口令仅存加盐 PBKDF2 哈希，附录 A #25）
          properties:
            users:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  password_hash:
                    type: string
                    format: password
                    description: "PBKDF2-SHA256 加盐哈希，格式 pbkdf2$sha256$<iter>$<b64salt>$<b64hash>；写入仅经 API/CLI，永不回显"
                  class: { type: string, example: super-user }
            classes:
              type: array
              description: 自定义 class（命令路径 allow/deny；预置 super-user/operator/read-only 见命令树 §4）
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  allow: { type: array, items: { type: string }, description: 允许的命令树路径前缀 }
                  deny: { type: array, items: { type: string }, description: 拒绝的命令树路径前缀（优先于 allow） }
            password_policy:
              type: object
              properties:
                min_length: { type: integer, default: 8 }
                complexity: { type: boolean, description: 要求至少 3/4 类字符（大写/小写/数字/特殊） }
                expire_days: { type: integer }
                lockout_threshold: { type: integer, default: 5, description: 连续失败锁定阈值 }
                lockout_minutes: { type: integer, default: 10, description: 锁定时长 }
        syslog:
          type: object
          properties:
            remote_host: { type: string, description: 远程 syslog 目标（FR-SYS-004） }
            remote_port: { type: integer, description: 远程 syslog 端口（缺省 514） }
            facility:
              type: string
              enum: [kern, user, mail, daemon, auth, syslog, lpr, news, uucp, cron, authpriv, ftp, local0, local1, local2, local3, local4, local5, local6, local7]
              description: RFC 5424 facility（缺省 user；FR-SYS-004）
            severity:
              type: string
              enum: [debug, info, warn, error]
              description: 远程转发的最低级别（缺省 info；FR-SYS-004）
            level: { type: string, enum: [debug, info, warn, error], description: 本地/守护进程日志级别（FR-OPS-030） }
            retention_days: { type: integer, description: 本地日志保留天数（FR-SYS-013） }
            max_size_mb: { type: integer, description: 本地日志容量上限，滚动覆盖 }
        api:
          type: object
          properties:
            port: { type: integer }
            token_ttl_minutes: { type: integer }
            max_sessions: { type: integer }
        idle_timeout_minutes: { type: integer }
        kernel:
          type: object
          description: 内核启动基线（FR-SYS-014；大页/隔离核由 resource-pools 派生）
          properties:
            nmi_watchdog: { type: boolean }
            transparent_hugepages: { type: string, enum: [always, madvise, never] }
            iommu: { type: string, enum: [on, off, pt] }
            low_latency: { type: boolean, description: "低延迟参数组（mitigations=off 等；显式选择，降低安全缓解与可诊断性）" }
            tuned_profile: { type: string }
            params: { type: array, items: { type: string } }

    Interface:
      type: object
      properties:
        name: { type: string, example: "ens2f0" }
        kind: { type: string, enum: [physical, management, vpp-internal] }
        driver: { type: string, example: "ice-dpdk" }
        enabled: { type: boolean }
        link: { type: string, enum: [up, down] }
        speed_mbps: { type: integer }
        mtu: { type: integer }
        mac: { type: string }
        numa_node: { type: integer }
        description: { type: string }
        sriov:
          type: object
          description: |
            SR-IOV VF 数量（FR-NET-004）。`vf_count` 为**声明式**配置：
            commit 时由编排器写入 PF 的 `sriov_numvfs`（0 = 回收全部），
            恢复收敛时重放；PF 不支持 SR-IOV 时 commit **明确失败**（不静默跳过，决策 #70）。
          properties:
            vf_count: { type: integer, description: 期望 VF 数（0 = 回收全部） }
            vfs:
              type: array
              items:
                type: object
                properties:
                  vf_id: { type: integer }
                  assigned_vnf: { type: string }
        statistics:
          type: object
          properties:
            rx_packets: { type: integer, format: int64 }
            tx_packets: { type: integer, format: int64 }
            rx_bytes: { type: integer, format: int64 }
            tx_bytes: { type: integer, format: int64 }
            rx_errors: { type: integer, format: int64 }
            tx_errors: { type: integer, format: int64 }
            rx_drops: { type: integer, format: int64 }
            tx_drops: { type: integer, format: int64 }

    InterfaceUpdate:
      type: object
      description: 物理网卡配置视图。在 ConfigDocument（整份配置文档）中 name 必填；PUT /interfaces/{name} 时可省略
      properties:
        name: { type: string, description: 接口名 }
        description: { type: string }
        mtu: { type: integer }
        enabled: { type: boolean }
        sriov:
          type: object
          description: SR-IOV VF 配置（FR-NET-004，命令树 §2.3）
          properties:
            vf_count: { type: integer }
        ingress_policy: { type: string, description: 入向限速策略绑定（命令树 §2.5） }

    VppConfig:
      type: object
      properties:
        cpu:
          type: object
          properties:
            main_core: { type: integer }
            corelist_workers: { type: string, example: "5,7" }
            workers_per_numa: { type: integer, description: 与 corelist_workers 互斥 }
        memory:
          type: object
          properties:
            main_heap_size: { type: string, example: "1G" }
            buffers_per_numa: { type: integer }
            hugepage_preference: { type: string, enum: ["2M", "1G"] }
        dpdk:
          type: object
          properties:
            dev:
              type: object
              description: 全局默认（作用于所有未单独配置的物理 NIC）
              properties:
                rx_queues: { type: integer }
                tx_queues: { type: integer }
                rx_descriptors: { type: integer }
                tx_descriptors: { type: integer }
            per_dev:
              type: array
              description: 单网卡覆盖（删除后回落全局默认）
              items:
                type: object
                required: [interface]
                properties:
                  interface: { type: string }
                  rx_queues: { type: integer }
                  tx_queues: { type: integer }
                  rx_descriptors: { type: integer }
                  tx_descriptors: { type: integer }
            uio_driver: { type: string, enum: [vfio-pci, igb-uio] }
        plugins:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              state: { type: string, enum: [enable, disable] }

    CaptureFile:
      type: object
      description: 已导出的 pcap 文件
      properties:
        name: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }

    CaptureStatus:
      type: object
      properties:
        active:
          type: object
          nullable: true
          properties:
            interface: { type: string }
            captured: { type: integer }
            started_at: { type: string, format: date-time }
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: "cap-ens2f0-20260912.pcap" }
              size_bytes: { type: integer, format: int64 }
              created_at: { type: string, format: date-time }

    Bond:
      type: object
      required: [name, members]
      properties:
        name: { type: string }
        members: { type: array, items: { type: string } }
        lacp:
          type: object
          nullable: true
          description: null = 静态聚合
          properties:
            mode: { type: string, enum: [active, passive] }
            interval: { type: string, enum: [fast, slow] }
        mtu: { type: integer }
        description: { type: string }
        state:
          type: object
          description: 运行态
          properties:
            link: { type: string, enum: [up, down] }
            active_members: { type: integer }

    LldpConfig:
      type: object
      properties:
        enabled: { type: boolean }
        advertisement_interval: { type: integer, default: 30 }
        interfaces:
          type: array
          items:
            type: object
            properties:
              interface: { type: string }
              enabled: { type: boolean }

    KernelBaseline:
      type: object
      properties:
        cmdline: { type: array, items: { type: string } }
        isolated_cores: { type: string }
        hugepages_1g: { type: integer }
        hugepages_1g_free: { type: integer }
        hugepages_2m: { type: integer }
        hugepages_2m_free: { type: integer }
        thp: { type: string }
        desired:
          type: object
          properties:
            hugepages_1g: { type: integer, description: "-1 = 不托管" }
            hugepages_2m: { type: integer, description: "0 = 不托管；与 1G 同时 >0 时按 hugepagesz 连写进 cmdline（决策 #106）" }
            isolated_cores: { type: string }
            nmi_watchdog: { type: boolean, nullable: true }
            transparent_hugepages: { type: string }
            iommu: { type: string }
            low_latency: { type: boolean }
            tuned_profile: { type: string }
            params: { type: array, items: { type: string } }
        diffs: { type: array, items: { type: string }, description: 差异项（空 = 一致） }

    HealthThresholds:
      type: object
      properties:
        cpu_temp_celsius: { type: integer, example: 85 }
        disk_temp_celsius: { type: integer, example: 60 }
        disk_used_percent: { type: integer, example: 90 }

    HardwareHealth:
      type: object
      properties:
        bmc_present: { type: boolean }
        sensors:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: CPU1 Temp }
              type: { type: string, enum: [temperature, fan, voltage, power] }
              value: { type: number }
              unit: { type: string }
              status: { type: string, enum: [ok, warning, critical] }
        disks:
          type: array
          items:
            type: object
            properties:
              device: { type: string }
              smart_status: { type: string, enum: [passed, failed, unknown] }
              temp_celsius: { type: number }
              wear_percent: { type: number }

    TlsInfo:
      type: object
      properties:
        subject: { type: string }
        issuer: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        self_signed: { type: boolean }

    BackupArchive:
      type: object
      properties:
        file: { type: string }
        kind: { type: string, enum: [config-backup, tech-support] }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        includes_core_dumps: { type: boolean, description: tech-support 归档时 }

    CoreDump:
      type: object
      properties:
        file: { type: string }
        process: { type: string, example: vpp_main }
        size_bytes: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }

    VirtualSwitch:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [l2, l3] }
        description: { type: string }
        vlan_access: { type: integer, description: 仅 L2：默认 untag VLAN }
        cross_connect: { type: boolean, description: 仅 L2：两端口直通模式 }
        gateway:
          type: object
          description: 仅 L2：BVI 三层网关（FR-NET-014）
          properties:
            addresses: { type: array, items: { type: string }, description: IPv4/IPv6 网关地址 }
            vrf: { type: string, description: 缺省为专属 VRF vr-<name> }
            acl_in: { type: string }
            acl_out: { type: string }
        ports:
          type: array
          items: { $ref: "#/components/schemas/VSwitchPort" }
        statistics:
          type: object
          description: |
            运行态统计（**仅详情端点 `GET /virtual-switches/{name}` 附带**；取自 VPP 运行态，
            与 CLI `show virtual-switches <name> statistics` 同源，FR-NET-016）。
            运行态未接入或交换机不在数据面时不返回（不编造）。
          properties:
            bd_id: { type: integer, description: VPP bridge-domain ID }
            ports:
              type: array
              description: 成员端口的收发计数（每端口一项）
              items:
                type: object
                properties:
                  port: { type: string, description: VPP 侧接口名 }
                  sw_if_index: { type: integer }
                  admin: { type: boolean, description: 管理态（运行态取不到时省略） }
                  link: { type: boolean, description: 链路态（运行态取不到时省略） }
                  rx_packets: { type: integer, description: 收包数（计数不可用时省略） }
                  tx_packets: { type: integer, description: 发包数（计数不可用时省略） }

    VSwitchPort:
      type: object
      required: [seq]
      properties:
        seq: { type: integer }
        interface: { type: string, description: 物理口名（与 vnf/container 三选一） }
        vnf: { type: string }
        vnf_interface: { type: string }
        container: { type: string }
        container_interface: { type: string }
        vlan:
          type: object
          properties:
            trunk: { type: array, items: { type: integer } }
            native: { type: integer }
        acl_in: { type: string }
        acl_out: { type: string }
        state: { type: string, enum: [up, down], description: 运行态 }

    Vrf:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        l3_interfaces:
          type: array
          items:
            type: object
            properties:
              interface: { type: string, example: "ens2f0.100" }
              vlan: { type: integer }
              addresses: { type: array, items: { type: string } }
              acl_in: { type: string }
        routes:
          type: array
          items: { $ref: "#/components/schemas/Route" }

    Route:
      type: object
      required: [prefix, next_hop]
      properties:
        prefix: { type: string, example: "0.0.0.0/0" }
        next_hop: { type: string }
        distance: { type: integer, default: 1 }

    Acl:
      type: object
      required: [name, rules]
      properties:
        name: { type: string }
        rules:
          type: array
          items:
            type: object
            required: [seq, action]
            properties:
              seq: { type: integer }
              direction: { type: string, enum: [ingress, egress] }
              source: { type: string, example: "10.0.0.0/8 或 any" }
              destination: { type: string }
              protocol: { type: string, enum: [tcp, udp, icmp, any] }
              source_port: { type: string }
              destination_port: { type: string }
              action: { type: string, enum: [permit, deny] }
              hits: { type: integer, description: 运行态命中计数 }

    NatConfig:
      type: object
      description: |
        NAT44-EI 配置。V1 语义（决策 #38/#52）：action.interface 必填（VPP outside 不支持自动推断）；
        inside 转发域由 rules[].virtual_switch（须为 L3 交换机）派生，outside 转发域由出接口所属 VRF 派生
        （出接口须为某 Vrf 的 l3-interface 且已配地址）；全部规则的 virtual-switch 必须一致、出接口必须同属一个 VRF；
        VPP NAT44 单实例仅一对 inside/outside VRF（两者可同表或跨 VRF）。
      properties:
        source_pools:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              address_range: { type: string, example: "100.64.0.10 to 100.64.0.50" }
        rules:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              match_source: { type: string }
              virtual_switch: { type: string, description: "L3 交换机名（inside 转发域由 TableID(名) 派生）" }
              action:
                type: object
                properties:
                  source_pool:
                    type: string
                    description: "外部地址池（可选）；未提供时以 action.interface 的接口地址作外部地址"
                  interface:
                    type: string
                    description: "出接口（必填，决策 #38）；V1 要求其作为某 Vrf 的 l3-interface 且已配地址（outside 转发域来源）"
        static:
          type: array
          items:
            type: object
            properties:
              inside_ip: { type: string }
              outside_ip: { type: string }

    PortMirroring:
      type: object
      required: [name, source, analyzer]
      properties:
        name: { type: string }
        source:
          type: object
          properties:
            interface: { type: string }
            vnf: { type: string }
            vnf_interface: { type: string }
            direction: { type: string, enum: [ingress, egress, both] }
        analyzer: { type: string, description: 分析端口（物理口） }

    QosPolicy:
      type: object
      required: [name, cir]
      properties:
        name: { type: string }
        cir: { type: integer, description: bps }
        cbs: { type: integer, description: bytes }
        bound_interfaces:
          type: array
          items: { type: string }

    ResourcePool:
      type: object
      properties:
        hugepages:
          type: array
          items:
            type: object
            properties:
              page_size: { type: string, enum: ["2M", "1G"] }
              count: { type: integer, description: 配置的页数量（配置文档用）；GET 运行态视图另含 total/allocated/free }
              total: { type: integer, description: 运行态：池总页数=count }
              allocated: { type: integer, description: 运行态：已分配给 VNF 的页数（backing=normal 的 VM 不占大页池） }
              free: { type: integer, description: 运行态：空闲页数（FR-CMP-003） }
        cpu:
          type: object
          properties:
            isolated_cores:
              type: array
              items: { type: integer }
              description: 配置：隔离核全集（可与 GET 运行态共用）
            numa:
              type: array
              items:
                type: object
                properties:
                  node: { type: integer }
                  cores: { type: array, items: { type: integer } }
              description: 配置：NUMA 节点与核（FR-CMP-001 NUMA 感知）
            allocated:
              type: array
              items:
                type: object
                properties:
                  vnf: { type: string }
                  cores: { type: array, items: { type: integer } }
              description: 运行态：各 VNF 绑核分配（按 committed 配置确定性重算，FR-CMP-002/003）
            free:
              type: array
              items: { type: integer }
              description: 运行态：未被 VPP 保留核与 VNF 绑核占用的隔离核（FR-CMP-003）
            vpp_reserved:
              type: array
              items: { type: integer }
              description: 运行态：VPP main-core + corelist-workers，账本先扣、VNF 不可用（FR-SYS-010）

    VMFunction:
      type: object
      required: [name, image, vcpu, memory]
      properties:
        name: { type: string }
        description: { type: string }
        image: { type: string }
        vcpu:
          type: object
          properties:
            count: { type: integer }
            pin: { type: boolean, default: true }
            cores_assigned: { type: array, items: { type: integer }, description: 运行态实际绑核 }
        memory:
          type: object
          properties:
            size_mb: { type: integer }
            hugepage_size: { type: string, enum: ["2M", "1G"] }
            numa_node: { type: integer }
            backing: { type: string, enum: [hugepage, normal], default: hugepage, description: normal 时禁止 vhost-user vNIC }
        disks:
          type: array
          description: 附加数据盘（virtio）
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              size_gb: { type: integer, description: 空盘容量（与 image 二选一） }
              image: { type: string, description: 从 vm-image 克隆创建 }
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/VnfInterface" }
        cloud_init:
          type: object
          properties:
            user_data: { type: string }
            ssh_keys: { type: array, items: { type: string } }
            hostname: { type: string }
        serial_console: { type: boolean, default: true }
        statistics:
          type: array
          description: |
            vhost-user vNIC 的收发计数（**仅详情端点 `GET /virtual-machine-functions/{name}` 附带**；
            取自 VPP 运行态，与 CLI `show virtual-machine-functions <name> statistics` 同源，FR-CMP-011）。
            非 vhost-user vNIC 不在其中；运行态未接入时不返回（不编造）。
          items:
            type: object
            properties:
              vnic: { type: string, description: 模型里的 vNIC 名 }
              interface: { type: string, description: VPP 侧接口名 vh-<vm>-<vnic> }
              available: { type: boolean, description: 该口在 VPP 中是否取到计数 }
              rx_packets: { type: integer }
              tx_packets: { type: integer }
              rx_bytes: { type: integer }
              tx_bytes: { type: integer }
        autostart: { type: boolean }
        state: { type: string, enum: [running, shutoff, crashed, paused], description: 运行态 }

    VnfInterface:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [vhost-user, sriov-vf, memif] }
        virtual_switch: { type: string, description: sriov-vf 时仅登记 }
        mac: { type: string }
        vlan: { type: integer }
        sriov:
          type: object
          properties:
            physical_interface: { type: string }
            vf_id: { type: integer }
        state: { type: string, enum: [up, down] }

    ContainerFunction:
      type: object
      required: [name, image]
      properties:
        name: { type: string }
        description: { type: string }
        image: { type: string }
        vcpu: { type: integer }
        memory_mb: { type: integer }
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/VnfInterface" }
        env:
          type: object
          additionalProperties: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        restart_policy: { type: string, enum: [no, on-failure] }
        autostart: { type: boolean }
        state: { type: string, enum: [running, exited, dead] }

    Image:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [vm-image, container-image] }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string }
        format: { type: string, example: qcow2 }
        description: { type: string }
        imported_at: { type: string, format: date-time }
        ref_count: { type: integer, description: 引用该镜像的 VNF 数 }
        import_state: { type: string, enum: [ready, downloading, failed], description: 运行态 }

    Snapshot:
      type: object
      properties:
        name: { type: string }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }
        description: { type: string }

    CommittedConfig:
      type: object
      description: committed 配置读取的响应（决策 #119：整配置出口，敏感字段已脱敏）
      properties:
        configuration: { $ref: "#/components/schemas/ConfigDocument" }
        revision: { type: integer, description: 当前 committed 配置版本号 }

    CandidateView:
      type: object
      description: candidate 读取的响应（决策 #119：契约按实现的实际形状声明——此前误声明为 ConfigDocument 本体）
      properties:
        candidate: { $ref: "#/components/schemas/ConfigDocument" }
        dirty: { type: boolean, description: 相对 committed 是否有未提交变更 }

    ConfigRevision:
      type: object
      description: |
        配置提交历史条目（决策 #142；`GET /configuration/history` 的数组元素）。
        **不含配置正文**——历史快照可能含敏感字段，列表只给元数据。
      properties:
        rev: { type: integer, description: 修订号（单调递增，最新一份即当前 committed） }
        committed_at: { type: string, format: date-time, description: 提交时间（UTC） }
        user: { type: string, description: 提交者；迁移前写入的历史快照未记录提交者，为空串 }
        comment: { type: string, description: 提交说明；未填时为空串 }
        current: { type: boolean, description: 是否为当前生效的 committed 修订 }

    DiagOutput:
      type: object
      description: 诊断命令的原始回显（决策 #123；文本原样返回，客户端自行展示）
      properties:
        output: { type: string }

    ConfigCheckResult:
      type: object
      description: 仅校验的结果（决策 #122：CLI `commit check` 的 REST 等价物）
      properties:
        ok: { type: boolean, description: 校验是否全部通过 }
        errors:
          type: array
          description: 校验问题清单（ok=true 时为空数组）
          items:
            type: object
            properties:
              path: { type: string, example: "system.hostname" }
              message: { type: string, example: "主机名不合法" }

    ConfigDocument:
      type: object
      description: 整份配置文档（JSON 形式，节点与 CLI 层级一致）
      properties:
        system: { $ref: "#/components/schemas/SystemConfig" }
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/InterfaceUpdate" }
        bonds:
          type: array
          description: 链路聚合（FR-NET-017，纳入事务引擎可 compare/rollback）
          items: { $ref: "#/components/schemas/Bond" }
        virtual_switches:
          type: array
          items: { $ref: "#/components/schemas/VirtualSwitch" }
        vrfs:
          type: array
          items: { $ref: "#/components/schemas/Vrf" }
        acls:
          type: array
          items: { $ref: "#/components/schemas/Acl" }
        nat: { $ref: "#/components/schemas/NatConfig" }
        port_mirroring:
          type: array
          items: { $ref: "#/components/schemas/PortMirroring" }
        qos_policies:
          type: array
          items: { $ref: "#/components/schemas/QosPolicy" }
        resource_pools: { $ref: "#/components/schemas/ResourcePool" }
        vpp:
          $ref: "#/components/schemas/VppConfig"
          description: VPP 数据面配置（FR-SYS-008，纳入事务引擎可 compare/rollback）
        protocols:
          type: object
          description: 顶级协议层级（命令树 §2.2b）
          properties:
            lldp: { $ref: "#/components/schemas/LldpConfig" }
        virtual_machine_functions:
          type: array
          items: { $ref: "#/components/schemas/VMFunction" }
        container_functions:
          type: array
          items: { $ref: "#/components/schemas/ContainerFunction" }
        annotations:
          type: object
          description: 配置节点注释（FR-CFG-007，annotate 语句；键为语句路径，如 "system hostname"）
          additionalProperties: { type: string }

    CommitResult:
      type: object
      properties:
        committed: { type: boolean }
        revision: { type: integer, description: 配置快照编号 }
        confirmed_until: { type: string, format: date-time, description: commit confirmed 截止时间 }
        warnings:
          type: array
          items: { type: string, example: "resource-pools 变更需 reboot 生效" }

    CLIExecuteResult:
      type: object
      properties:
        output: { type: string }
        mode: { type: string, enum: [oper, config] }
        path: { type: array, items: { type: string } }
        prompt: { type: string }

    ConfigSession:
      type: object
      description: candidate 会话锁持有信息（FR-CFG-009）
      properties:
        holder: { type: string, example: "admin@ssh" }
        acquired_at: { type: string, format: date-time }
        last_activity: { type: string, format: date-time }
        dirty: { type: boolean, description: 存在未提交变更 }
        confirmed_until: { type: string, format: date-time, description: 在途 commit confirmed 截止时间 }

    Alarm:
      type: object
      required: [id, severity, code, message, raised_at, state]
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, warning, error, critical] }
        code: { type: string, example: VNF_CRASHED }
        message: { type: string }
        source: { type: string, example: "virtual-machine-functions/fw-vm" }
        raised_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        state: { type: string, enum: [active, resolved] }

    Event:
      type: object
      properties:
        type: { type: string, enum: [alarm-raised, alarm-resolved, vnf-state-changed, image-import-progress, config-committed] }
        timestamp: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }

    AuditEntry:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        user: { type: string }
        source_ip: { type: string }
        action: { type: string, example: "config.commit / vmf.start / login" }
        detail: { type: string, description: 配置 diff 或操作参数摘要 }
        result: { type: string, enum: [success, failure] }
        time_synced:
          type: boolean
          description: |
            写入该条记录时宿主时钟是否已与 NTP 同步（NFR-006）。审计时间戳依赖 NTP，
            **未同步时为 false**，据此判断时间戳是否可信。该字段缺失表示**未知**
            （schema 迁移前写入的老记录没有这个信息），不代表已同步。
