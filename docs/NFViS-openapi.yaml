openapi: 3.0.3
info:
  title: NFViS REST API
  version: 1.0.0
  description: |
    NFViS 一体机 REST API（V1）。
    - 配置类写操作默认作用于 candidate，需 POST /configuration/commit 生效；
      请求头 `X-NFVIS-Auto-Commit: true` 可让单请求直接提交。
    - 编辑锁（会话锁，FR-CFG-009）：写入 candidate 的请求会取得全局编辑锁。**会话按「身份 + 登录」
      区分**（决策 #317）：展示用持有者为「用户 + 接入源」，实际归属按会话稳定标识（token 稳定 ID）
      ——同一用户的另一个登录（控制台/CLI/脚本）是**另一个会话**，其登出或一次性命令不会丢弃本会话
      未提交的候选。
      锁的排他性只为保护**未提交的候选**（决策 #318）：持有会话的候选**无未提交改动**时，
      同一用户的新会话可直接**接管**该锁（跨用户不可；原持有者再操作报明确错误）；有未提交改动时
      严格排他。
      一次性事务（带 `X-NFVIS-Auto-Commit: true` 的写、以及 /system/login-users 一族——它们提交即生效）
      在收尾时交还锁；纯候选写入（无该头）与 POST /configuration/commit 之后锁仍在，
      由客户端显式收尾（`DELETE /configuration/candidate`）或 POST /logout 释放（登出按会话标识清本
      会话的锁，**不区分接入源**——CLI 侧 `user@ssh` 取得的锁也一并释放）。
    - 错误响应统一为 Error 结构；校验错误逐条列入 detail。
    - 事件经 SSE 推送：GET /events（text/event-stream）。
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: nfvis.local
tags:
  - name: auth
  - name: system
  - name: interfaces
  - name: virtual-switches
  - name: vrfs
  - name: acls
  - name: nat
  - name: port-mirroring
  - name: qos
  - name: vpp
  - name: dns
  - name: resource-pools
  - name: virtual-machine-functions
  - name: container-functions
  - name: images
  - name: configuration
  - name: alarms-events
  - name: audit

security:
  - bearerAuth: []

paths:
  /login:
    post:
      tags: [auth]
      summary: 登录获取 Bearer Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: token 与用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401": { $ref: "#/components/responses/Error401" }
        "423": { $ref: "#/components/responses/Error403" }   # 连续失败锁定

  /logout:
    post:
      tags: [auth]
      summary: 吊销当前 token
      description: |
        吊销调用者自己的 token，并**丢弃本会话**的 candidate 编辑锁（决策 #119）。
        决策 #317：只作用**本会话**（会话标识 = 本 token 的稳定 ID）——同一用户其它登录
        （另一个浏览器/CLI 终端/脚本）未提交的候选与编辑锁**不受影响**。未在编辑时也返回 204。
        决策 #318：本会话的锁**不区分接入源**地释放——CLI 侧以 `user@ssh`（或 `user@console`）
        取得的锁，由登出请求（会话身份来自 REST）按 token 稳定 ID 一并清掉；匹配仍只认本 token。
      responses:
        "204": { description: 已吊销 }

  /login-banner:
    get:
      tags: [auth]
      summary: 登录横幅（未认证只读，登录页展示用）
      security: []
      description: |
        返回配置的登录横幅文本。该端点**不要求鉴权**（登录前就要显示），且**只返回横幅文本本身**——
        不返回主机名、版本、用户清单等任何其他信息（登录前不给探查面）。
        未设置横幅时响应为空对象：`banner` 字段省略（不回空串、不编造），客户端据此不渲染横幅块。
      responses:
        "200":
          description: OK（未设置横幅时 banner 字段省略）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginBanner" }

  /system/api-tokens:
    get:
      tags: [system]
      summary: 活动会话 / API Token 清单（等价 CLI show system api tokens）
      description: |
        token 为内存运行态（nfvisd 重启后全部失效），本清单只覆盖当前进程内的活动会话。
        权限与范围：super-user 列出**全部用户**的 token；其他 class 只列出自己的。
        token 本体（凭据）永不出现在本清单，只有稳定 token_id。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenList" }
        "401": { $ref: "#/components/responses/Error401" }

  /system/api-tokens/{id}:revoke:
    post:
      tags: [system]
      summary: 吊销指定会话（等价 CLI request system api token revoke <token-id>）
      description: |
        权限与范围：super-user 可吊销任意 token；其他 class 只能吊销自己的。
        吊销不存在的/他人的 token_id 统一回 404「会话不存在或无权操作」（不泄露存在性）；
        吊销后该 token 的下一个请求即 401。吊销**当前**会话等价于登出（本会话 candidate 锁随之释放；
        决策 #318：按 token 稳定标识释放，**不区分接入源**——CLI 侧 `user@ssh` 的锁也一并清掉）；
        吊销**他人**会话不主动释放其编辑锁——由既有空闲巡检（lock_idle_ttl）回收（决策 #317）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: token 稳定 ID（GET /system/api-tokens 的 token_id） }
      responses:
        "204": { description: 已吊销 }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }

  /system/status:
    get:
      tags: [system]
      summary: 系统状态（uptime/CPU/内存/大页/磁盘）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }

  /system/version:
    get:
      tags: [system]
      summary: 组件版本
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }

  /vpp/restart:
    post:
      tags: [vpp]
      summary: 按 committed 配置重建 startup.conf 并重启 VPP（FR-SYS-009，super-user）
      description: |
        返回成功**即代表数据面可查询**（决策 #315）：本端点返回前完成两项有界判定——
        ①裸 binary API socket 可连（VPP 进程真的活着，避免「重启动作被接受」被报成成功）；
        ②nfvisd 连接管理器的**自身会话已换成新连接**（与 `/vpp/status` 同一事实源）。
        只看①不够：VPP 重启后 govpp 报断连前，管理器仍持有旧会话，「重启返回后立即查询」
        会撞 `write: broken pipe`（round34/35 现象）。任一判定在窗口内未满足则返回 500 并
        说明「VPP 已起来 / VPP 未起来」与「数据面连接在重启窗口内不可用」及下一步指引。
      responses:
        "202": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }
        "500":
          description: |
            VPP 未起来（大页池被清空/启动失败等）或 **数据面连接未在窗口内恢复**（决策 #315）；
            message 含成因与指引（`show vpp` / `request vpp restart` / `journalctl -u vpp`）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /system/configuration/sessions:
    get:
      tags: [configuration]
      summary: candidate 持锁会话列表（FR-CFG-009，对应 show system configuration sessions）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConfigSession" }

  /system:
    put:
      tags: [system]
      summary: 修改系统配置（hostname/ntp/dns/syslog/api/management/idle-timeout）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemConfig" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
    get:
      tags: [system]
      summary: 读取系统配置
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemConfig" }

  /system/login-users:
    get:
      tags: [system]
      summary: 本地用户与 class 列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoginUser" }
    post:
      tags: [system]
      summary: 创建用户或 class
      description: |
        一次性事务：用户/口令变更**必须生效**（FR-SEC-008），本族端点提交即生效、
        无需（也不该）由调用方再 commit；收尾时交还全局编辑锁（决策 #151）——
        提交后本会话不再持锁，其它会话可立即写入 candidate。
        **本会话已有未提交候选时拒绝**（决策 #316）：本族操作只做它声明的那一项改动，
        不会把配置页正在编辑的候选一并提交；此时返回 409 并说明「先提交或丢弃候选」。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginUser" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
        "409": { $ref: "#/components/responses/Error409" }   # 本会话候选未提交（决策 #316）/ 重名

  /interfaces:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [interfaces]
      summary: 接口列表（kind=physical|management|vpp）
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [physical, management, vpp, all] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Interface" }
  /interfaces/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [interfaces]
      summary: 接口详情（含统计）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interface" }
        "404": { $ref: "#/components/responses/Error404" }
    put:
      tags: [interfaces]
      summary: 修改接口（description/mtu/enabled）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterfaceUpdate" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "404": { $ref: "#/components/responses/Error404" }

  /virtual-switches:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [virtual-switches]
      summary: 虚拟交换机列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VirtualSwitch" }
    post:
      tags: [virtual-switches]
      summary: 创建虚拟交换机
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VirtualSwitch" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
        "400": { $ref: "#/components/responses/Error400" }
  /virtual-switches/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [virtual-switches]
      summary: 详情
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VirtualSwitch" }
        "404": { $ref: "#/components/responses/Error404" }
    delete:
      tags: [virtual-switches]
      summary: 删除（有成员引用时 409）
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }
  /virtual-switches/{name}/ports:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [virtual-switches]
      summary: 成员端口（配置静态声明 ∪ VNF/容器 vNIC 声明派生）与实时状态
      description: |
        决策 #326（收口 R84-16）：这是**读视图**——配置里静态声明的 ports（source=config）与
        VNF/容器 `interfaces <nic> virtual-switch <name>` 声明派生出的 vNIC 成员
        （source=vnf|container）的并集，逐条带 source；另有仅在数据面存在、配置未声明的成员
        （source=runtime，运行态不可用时为空）。配置库形状不变：写入仍是 PUT（全量替换静态 ports）。
        派生条目**只读**——删除应指向声明它的 VNF/容器（CLI `show virtual-switches <n> ports`
        与 Web 交换机详情页展示同一份读视图）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SwitchPortView" }
    put:
      tags: [virtual-switches]
      summary: 全量替换成员端口列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/VSwitchPort" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
  /virtual-switches/{name}/mac-table:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [virtual-switches]
      summary: MAC 学习表（仅 L2）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    mac: { type: string }
                    port: { type: string }
                    vlan: { type: integer }

  /vrfs:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [vrfs]
      summary: VRF（L3 虚拟交换机）列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vrf" }
    post:
      tags: [vrfs]
      summary: 创建 VRF
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Vrf" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /vrfs/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [vrfs]
      summary: VRF 详情
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vrf" }
    delete:
      tags: [vrfs]
      summary: 删除 VRF
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }
  /vrfs/{name}/routes:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [vrfs]
      summary: FIB 路由表（运行态）
      description: |
        返回该 VRF 的运行态 FIB，**含 IPv4 与 IPv6**（FR-NET-013）。
        注：VPP `ip_route_dump` 不显式指定协议时只返回 IPv4，v6 须单独 dump 后合并
        （决策 #69 修复；此前 v6 静态路由已下发但此端点不可见）。
        **VRF 不在 committed 中时返回 404**（不静默回空数组——否则「VRF 不存在」会被显示成
        「无路由」；与 CLI `show vrfs <name> routes` 同口径，决策 #76④）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Route" }
        "404": { $ref: "#/components/responses/Error404" }
    put:
      tags: [vrfs]
      summary: 全量替换静态路由
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Route" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }

  /acls:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [acls]
      summary: ACL 列表（含命中计数）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Acl" }
    post:
      tags: [acls]
      summary: 创建 ACL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Acl" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /acls/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [acls]
      summary: ACL 详情
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Acl" }
    delete:
      tags: [acls]
      summary: 删除 ACL
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }

  /nat/sessions:
    get:
      tags: [nat]
      summary: NAT44 会话表（运行态，空表返回 []）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    inside_ip: { type: string }
                    inside_port: { type: integer }
                    outside_ip: { type: string }
                    outside_port: { type: integer }
                    protocol: { type: integer }
                    bytes: { type: integer, format: int64 }
                    packets: { type: integer, format: int64 }

  /nat:
    get:
      tags: [nat]
      summary: NAT 池与规则
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NatConfig" }
    put:
      tags: [nat]
      summary: 全量替换 NAT 配置
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NatConfig" }
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }

  /port-mirroring:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [port-mirroring]
      summary: SPAN 会话列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PortMirroring" }
    post:
      tags: [port-mirroring]
      summary: 创建 SPAN 会话
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortMirroring" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /port-mirroring/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    delete:
      tags: [port-mirroring]
      summary: 删除 SPAN 会话
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }

  /qos/policies:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [qos]
      summary: 限速策略列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QosPolicy" }
    post:
      tags: [qos]
      summary: 创建限速策略
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QosPolicy" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /qos/policies/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    delete:
      tags: [qos]
      summary: 删除策略
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }

  /resource-pools:
    get:
      tags: [resource-pools]
