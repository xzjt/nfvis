      tags: [images]
      summary: 删除镜像（被引用时 409）
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }

  /configuration:
    get:
      tags: [configuration]
      summary: 读取 committed 配置（全量，敏感字段已脱敏）
      description: |
        返回当前生效配置的整份文档与版本号。此前只有分段读取（`GET /system`、`GET /vpp/config`
        等配置段），没有整配置出口——CLI 的 `show configuration` 因此没有 REST 等价物
        （round42 覆盖核查的缺口 #1，增量 2 的阻塞项，决策 #119）。敏感字段（口令哈希等）
        与 candidate 读取同样脱敏（FR-SEC-007）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommittedConfig" }

  /configuration/permissions:
    get:
      tags: [configuration]
      summary: 某 login class 的生效权限视图（等价 CLI show configuration permissions <class>）
      description: |
        把该 class 在 CLI 命令树上的有效判定**逐路径**算出来（决策 #304）：预置三档按 §4 权限矩阵的
        节点等级，自定义 class 按 allow/deny 路径前缀（deny 优先、allow 放行、其余默认拒绝）。
        判定与 CLI **同一实现单源**（`internal/aaa`，与运行期授权同一套函数）。
        权限：R 类；`class` 缺省 = 调用者自己的 class；非 super-user 查他人 class 返回 403
        （不泄露他人 class 的规则细节）；未知 class 名返回 404。
      parameters:
        - { name: class, in: query, required: false, schema: { type: string }, description: 目标 class 名（缺省 = 调用者自己的 class） }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassPermissions" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /configuration/candidate:
    get:
      tags: [configuration]
      summary: 读取当前会话 candidate
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateView" }
    put:
      tags: [configuration]
      summary: 写 candidate（override 或 merge）
      description: |
        两种语义：缺省 = **override**（整体替换，等价 CLI `load override`）；
        请求头 `X-NFVIS-Merge: true` = **merge**（按字段合并，等价 CLI `load merge`）——
        只覆盖文档里出现的字段，未出现的保持不动（`model.Merge` 语义）。
        200 响应的 `candidate` 是**合并后**的结果（merge 时与请求体不同）。
        整文档替换意味着"文档里没写的账号就没了"：若替换/合并后的文档一个 super-user
        （class 为 `super-user`）都不剩，则**带 Auto-Commit 的提交分支**返回 400
        `VALIDATION_FAILED`（本机不能提交成无人可登录，详见 POST /configuration/commit）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigDocument" }
      responses:
        "200":
          description: |
            candidate 已更新（未提交）。缺省分支返回 `CandidateView`（`candidate` 为替换/合并后的文档）；
            带 `X-NFVIS-Auto-Commit: true` 时走提交分支、返回 `CommitResult`（两种形状，
            故此处不声明 schema——形状守护覆盖的是 GET 分支）。
            **编辑锁**：缺省分支持有编辑锁（操作者继续编辑）；Auto-Commit 分支是一次性事务，
            提交后交还锁（候选干净时），因此后续读 candidate 会得到 409——
            要基于生效配置继续写，请读 `GET /configuration`。
    delete:
      tags: [configuration]
      summary: 丢弃 candidate（discard）
      responses:
        "204": { description: 已丢弃 }
  /configuration/commit:
    post:
      tags: [configuration]
      summary: 提交 candidate（含校验+下发底座）
      description: |
        管理口地址/网关变更须以 commit confirmed 提交（`confirmed_minutes > 0`）：
        凡**经网络接入**的会话（SSH、REST/Web 控制台）都受此约束（FR-CFG-012，决策 #121），
        本地串口豁免；未带 `confirmed_minutes` 时返回 400 `CONFIRM_REQUIRED`。
        确认期内未调用 `POST /configuration/commit:confirm` 将自动回滚。
        提交的文档还必须**至少保留一个 super-user 账号**（class 为 `super-user`；class 缺省
        按 `read-only` 算），否则本机将无人可登录（只能带外恢复）——这类提交被拒（400
        `VALIDATION_FAILED`，候选与编辑锁保留，改完可重提）；要复位账号请用恢复出厂。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed_minutes: { type: integer, description: "大于 0 时为 commit confirmed" }
                message: { type: string }
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "400":
          description: |
            校验失败（detail 列出全部错误）；或管理口变更未走 commit confirmed
            （code=CONFIRM_REQUIRED）；或提交后一个 super-user 都不剩（自锁，见上）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Error409" }
  /configuration/commit:confirm:
    post:
      tags: [configuration]
      summary: 确认 commit confirmed
      responses:
        "200": { description: 已确认 }
  /configuration/diff:
    get:
      tags: [configuration]
      summary: candidate ⇄ committed 差异
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string }
  /configuration/check:
    post:
      tags: [configuration]
      summary: 仅校验 candidate 不下发（CLI `commit check` 的 REST 等价物）
      description: |
        运行与提交相同的全部校验（schema + 语义 + 镜像存在性等）但**不落库、不下发底座**，
        供控制台在提交前预校验（round42 覆盖核查缺口 #10，决策 #122）。
        需要持有 candidate 会话（与 commit 相同）；校验发现问题时仍返回 200——
        检查本身是成功的，结果在 `ok` 与 `errors` 里。
      responses:
        "200":
          description: 校验完成（ok=false 时 errors 列出全部问题）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigCheckResult" }
        "409": { $ref: "#/components/responses/Error409" }
  /configuration/history:
    get:
      tags: [configuration]
      summary: 配置提交历史（rev/时间/用户/注释，最新在前）
      description: |
        列出保留的 committed 历史快照的**元数据**（决策 #142）：CLI 有 `rollback [n]` 与
        `show configuration compare rollback <n>`，但此前没有「列出历史快照」的读物——
        控制台的配置历史页（`#/config/history`）需要「rev → 时间/用户/注释」的列表，
        操作者据此先看差异再回滚。
        权限与 `GET /configuration` 同口径（ClassReadOnly，命令树路径 `show configuration history`）。
        **只回元数据、不回配置正文**（FR-SEC-007：历史快照里可能含口令哈希等敏感字段，
        列表不需要它们，故不脱敏也不外发）；`user` 对迁移前写入的历史快照为空串——
        当时未记录提交者，宁可空着也不编造。
      responses:
        "200":
          description: OK（无历史时为空数组）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConfigRevision" }
  /configuration/rollback/{n}:
    parameters: [{ name: n, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 50 } }]
    post:
      tags: [configuration]
      summary: 取第 n 个历史快照为 candidate（需再 commit）
      responses:
        "200": { description: candidate 已替换为历史快照 }
        "404": { $ref: "#/components/responses/Error404" }

  /cli/execute:
    post:
      tags: [configuration]
      x-internal: true
      summary: 执行一行 CLI 命令（cli_bridge，仅 nfvis-cli 使用，不承诺第三方兼容）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line]
              properties:
                line: { type: string, description: CLI 命令行（不含管道时逐字执行） }
                source: { type: string, enum: [ssh, console], description: 接入源（影响 FR-CFG-012 自锁判定） }
      responses:
        "200":
          description: 执行结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CLIExecuteResult" }
        "400": { $ref: "#/components/responses/Error400" }

  /cli/candidates:
    get:
      tags: [configuration]
      x-internal: true
      summary: CLI ?/Tab 补全候选（仅 nfvis-cli 使用）
      parameters:
        - { name: tokens, in: query, schema: { type: string }, description: 已完成 token（逗号分隔） }
        - { name: partial, in: query, schema: { type: string }, description: 正在输入的前缀 }
        - { name: kind, in: query, schema: { type: string }, description: "清单模式（动态候选来源）。接口名一族分三种（决策 #83，来源不同）：vpp-ifnames=VPP 中的接口/已被 DPDK 接管的数据面端口；kernel-ifnames=内核网卡/未被接管的物理口（管理口、bind-dpdk、SR-IOV PF 用）；ifnames=两者并集（动作混合的 request interfaces <n> 用）。其余：vmnames/vswitches/vrfs/ctnames/images/classes/revisions/vppplugins/acls/qos-policies" }
      responses:
        "200":
          description: 候选列表（token/desc 对，或 kind 模式下的字符串清单）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Token: { type: string }
                    Desc: { type: string }

  /alarms:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [alarms-events]
      summary: 告警列表（state=active|resolved|all）
      parameters: [{ name: state, in: query, schema: { type: string, enum: [active, resolved, all], default: active } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alarm" }
  /events:
    get:
      tags: [alarms-events]
      summary: 事件流（SSE）
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }

  /audit-logs:
    get:
      tags: [audit]
      summary: 审计日志（分页）
      description: |
        审计记录（FR-CFG-010/FR-OPS-031）。**高危档动作记两条**（决策 #150，设计 §7）：
        动作开始执行之前一条「意图」（`result: intent`，detail 写明要做什么、含关键参数），
        动作结束后一条「结果」（`result: success|failure`，失败带原因）。两条的 `action`
        相同，据此配对；其余动作仍只有一条结果记录（不产生额外审计噪音）。
        口令、口令哈希与证书/私钥正文**一律不入审计**（FR-SEC-007）。
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: user, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  /metrics:
    get:
      tags: [system]
      summary: Prometheus 指标
      security: []
      responses:
        "200":
          description: text/plain; version=0.0.4
          content:
            text/plain:
              schema: { type: string }

  /ui:
    get:
      tags: [system]
      summary: Web 控制面入口（重定向到 /ui/）
      description: |
        决策 #115：V2 Web 控制面增量 1（只读总览）内嵌进 nfvisd 并**同源**托管。
        本路径只做跳转到 `/ui/`，免得操作者少打一个斜杠拿到 404。
        无鉴权：静态资源不含敏感信息，且登录页必须先能加载。
      security: []
      responses:
        "302":
          description: 跳转到 /ui/
          headers:
            Location: { schema: { type: string } }

  /ui/:
    get:
      tags: [system]
      summary: Web 控制面静态资源（index.html / app.js / style.css）
      description: |
        决策 #115：内嵌进二进制的免构建前端（原生 HTML/CSS/JS，无 npm）。
        数据不从这里取——页面经既有 REST 端点 + `Authorization: Bearer` 读取，
        实时刷新用 `GET /events`（SSE）；token 存浏览器 sessionStorage，关标签页即失效。
        无鉴权（与 /metrics、/openapi.json 同例）。
      security: []
      responses:
        "200":
          description: 静态资源（按扩展名返回 text/html、text/javascript、text/css）
          content:
            text/html:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/Error404"

  /openapi.json:
    get:
      tags: [system]
      summary: 本规范（OpenAPI 3.0 文档，随产品发布的运行时副本）
      description: |
        FR-API-002：Web 控制面据此开发。内容为随二进制嵌入的本规范 JSON，
        与 `docs/NFViS-openapi.yaml` 同源（由 `make docscheck` 守护一致性）。
        无鉴权（与 /metrics 同）：该文档亦随 deb 安装于 `/usr/share/doc/nfvis/`，不含敏感信息。
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, description: OpenAPI 3.0 文档 }

  /vpp/status:
    get:
      tags: [system]
      summary: VPP 数据面状态（版本、线程/worker、buffer、内存、配置版本）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VppStatus" }
  /vpp/config:
    get:
      tags: [system]
      summary: 读取 VPP 数据面配置（startup.conf 生成源）
      description: |
        只读端点。**VPP 配置没有写端点**：数据面的 cpu/memory/dpdk 变更走配置模式
        （`PUT /configuration/candidate` + `POST /configuration/commit`，CLI 侧是
        `set vpp …` + `commit`），由配置事务统一校验与审计；此前这里声明的 `put:`
        是**死声明**——服务端从未注册该路由（决策 #153）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VppConfig" }
  /dns/proxy:
    get:
      tags: [dns]
      summary: 数据面 DNS 代理的启用态、全局上游与各域覆盖（决策 #345，FR-NET-010）
      description: |
        域内 VNF/容器把 resolver 指向**产品自己的地址**（交换机网关 BVI / L3 接口地址）即可解析。
        产品侧实现为**自研域内转发器**：VPP 经 `punt socket` 把「目的地址 ∈ VPP 本机」的 UDP/53
        交给 nfvisd，nfvisd 用**宿主网络栈**向上游解析后按原域回注（VPP `PUNT_IP4_ROUTED`）。
        上游取来源域（按交换机）配置，未配则回落全局；两者皆空时对该域查询回 **SERVFAIL**
        （不静默超时）。纯 UDP 转发：不缓存、不解析内容；客户端用 **TCP** 查 DNS 不在覆盖内。
        本端点只读产品自身配置声明；与宿主解析器 `set system dns server`
        （`SystemConfig.dns_servers`）是两回事。**覆盖范围**：本版注册的是 **IPv4/UDP/53**
        （punt 按地址族注册）——IPv6 的解析查询尚未覆盖（待 v6 注册与回注路径真机验证后启用）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsProxyView" }
  /vpp/capture:
    get:
      tags: [system]
      summary: 抓包会话状态与已导出 pcap 清单（单会话；导出文件落 /var/lib/nfvis/captures）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureStatus" }
    post:
      tags: [system]
      summary: 开始数据面抓包（达到 count 自动停止）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interface]
              properties:
                interface: { type: string }
                count:
                  type: integer
                  default: 1000
                  description: |
                    VPP 抓包缓冲深度（环形，超出丢最旧）。注意：VPP 26.06 的 pcap trace 以
                    max_packets 作为缓冲深度且无“已抓包计数”接口，故非“达到 count 自动停止”；
                    需显式 stop/export（契约语义按实测调整，见附录 A #59）。
                filter_acl:
                  type: string
                  description: "V1 不支持：VPP 26.06 pcap trace 无 ACL 过滤（仅支持按 error），非空返回 400"
      responses:
        "202": { description: 已开始 }
        "409": { $ref: "#/components/responses/Error409" }   # 已有会话进行中
    delete:
      tags: [system]
      summary: 停止抓包（`?export=true` 时同时导出 pcap）
      description: |
        缺省只停止（丢弃缓冲）；`?export=true` 表示**停止并导出**——与 CLI
        `request vpp trace export` 同义（此前只有 CLI 能导出，REST 侧无法表达，界面因此接不上）。
      parameters:
        - name: export
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: true = 停止并导出 pcap 到 /var/lib/nfvis/captures
      responses:
        "204": { description: 已停止（未导出） }
        "200":
          description: 已停止并导出（返回导出的文件）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureFile" }
  /vpp/capture/{file}:
    parameters: [{ name: file, in: path, required: true, schema: { type: string } }]
    get:
      tags: [system]
      summary: 下载 pcap 文件
      responses:
        "200":
          description: application/octet-stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /bonds:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 返回条数上限；缺省不截断（FR-API-007） }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 跳过条数（FR-API-007） }
    get:
      tags: [interfaces]
      summary: 链路聚合列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bond" }
    post:
      tags: [interfaces]
      summary: 创建 bond
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Bond" }
      responses:
        "201": { $ref: "#/components/responses/ConfigAccepted" }
  /bonds/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    get:
      tags: [interfaces]
      summary: bond 详情（含 LACP actor/partner 状态）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bond" }
    delete:
      tags: [interfaces]
      summary: 删除 bond（被引用时 409）
      responses:
        "200": { $ref: "#/components/responses/ConfigAccepted" }
        "409": { $ref: "#/components/responses/Error409" }

  /system:reboot:
    post:
      tags: [system]
      summary: 重启系统
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean, description: 必须为 true }
      responses:
        "202": { description: 已受理 }
        "400": { $ref: "#/components/responses/Error400" }
  /system:shutdown:
    post:
      tags: [system]
      summary: 关机（或 poweroff）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean, description: 必须为 true }
      responses:
        "202": { description: 已受理 }
        "400": { $ref: "#/components/responses/Error400" }
  /system:zeroize:
    post:
      tags: [system]
      summary: 恢复出厂（清空数据分区配置/镜像/VNF 并重置账号，FR-OPS-007）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, description: 双重确认，必须为 true }
      responses:
        "202": { description: 已受理，重启后进入初始化状态 }
        "400": { $ref: "#/components/responses/Error400" }
  /system:format-data:
    post:
      tags: [system]
      summary: 重置数据分区（恢复出厂数据状态，保留管理面可达；决策 #305）
      description: |
        收敛删除全部受管 VNF/容器（含其快照）与网络配置对象、清空受管数据目录（镜像/备份/抓包/转储/诊断归档/VM 磁盘），
        并把配置重置为「保留节」最小配置。`system.management`/`system.api`/`system.login` 三节与物理口声明
        `set interfaces …`、DPDK 声明 `set vpp dpdk dev …` 原样保留，底座与身份（VPP/libvirt/docker、二进制、
        TLS 证书、SSH host key、systemd 单元）不动——操作者执行完仍可登录继续配置，不必重启才能恢复。
        高危档：需 `confirm=true`；**部分失败（有残留）时返回 500** 并在 message 里逐条列出残留与原因，绝不在未清干净时报成功。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, description: 双重确认，必须为 true }
      responses:
        "202":
          description: 已重置；响应体为统计与残留清单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormatDataResult" }
        "400": { $ref: "#/components/responses/Error400" }
        "500": { description: 部分失败：有残留未清除（message 逐条列出），已清部分不回滚 }
  /system/software:
    post:
      tags: [system]
      summary: 安装 nfvis 软件包（deb 路径或 URL，校验→升级→重启 nfvisd→报告）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package]
              properties:
                package: { type: string, description: 本地路径或 https URL }
                sha256: { type: string }
      responses:
        "202": { description: 已受理（异步，事件通知结果） }
        "400": { $ref: "#/components/responses/Error400" }
  /system/software:rollback:
    post:
      tags: [system]
      summary: 回退到上一版本
      responses:
        "202": { description: 已受理 }
  /system/ntp:sync:
    post:
      tags: [system]
      summary: 立即触发一次 NTP 同步
      responses:
        "200": { description: 已触发 }
  /system/kernel:
    get:
      tags: [system]
      summary: 内核启动基线三方对照（cmdline / 运行实际 / 配置期望 + 差异）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KernelBaseline" }
  /system/kernel:apply:
    post:
      tags: [system]
      summary: 按 committed 配置写入 GRUB 基线（需重启生效，FR-SYS-014，super-user）
      description: |
        与 CLI `request system kernel apply` **同一实现**（同一份派生 + 同一份落地器）。
        写入 GRUB 片段 / fstab 大页挂载并 update-grub；**需重启生效**，故响应里给出 pending_reboot 差异。
        class 为 super-user（决策 #146：命令树 §3 与《命令全表》都写 S，此前代码树漏了 Su() 标记）。
      responses:
        "200":
          description: 已写入（含 backup 路径与 pending_reboot 差异）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KernelBaselineAction" }
        "400": { $ref: "#/components/responses/Error400" }
        "403": { $ref: "#/components/responses/Error403" }
        "503": { description: 内核基线落地未接入（未装配落地器） }
  /system/kernel:rollback:
    post:
      tags: [system]
      summary: 回退上一次内核基线（需重启生效，FR-SYS-014，super-user）
      description: 与 CLI `request system kernel rollback` 同一实现；class 同 apply。
      responses:
        "200":
          description: 已回退
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KernelBaselineAction" }
        "400": { $ref: "#/components/responses/Error400" }
        "403": { $ref: "#/components/responses/Error403" }
        "503": { description: 内核基线落地未接入（未装配落地器） }

  /system/hugepages:
    get:
      tags: [system]
      summary: 大页池数字（声明/内核实际/在用/实际持有/无主占用）与可回收页数（决策 #329/#346）
      description: |
        数字如实呈现：**声明值**（committed 的 resource-pools，产品唯一真源）、**内核实际**（sysfs
        nr_hugepages）、**在用值**（实际 − 空闲）、**实际持有**（按 `/proc/*/smaps` 的 hugetlb 映射
        按 inode 去重汇总、折算到本页尺寸）、**无主占用**（= 在用 − 实际持有，≥0）。
        ⚠️ **在用 ≠ 有持有者**（决策 #346 更正 #329 的措辞）：内核收缩池（例如开机 `hugepages=4`
        后按声明收敛到 2）、或被进程**预留（reserve）但未 fault** 的页（如数据面 DPDK 预留）都算
        「在用」却没有可见持有者；这类页只体现在 `orphan`，并由 `HUGEPAGE_POOL_ORPHAN` 告警如实
        报出——它们**不在空闲链表上**，产品侧写 `nr_hugepages` 释放不了，`reclaim` **不会动它们**
        （需从预留者一侧释放）。
        取不到内核值时就 state=unreadable、actual/free/in_use 回 -1 并给 note；持有值取不到时
        held/orphan 回 -1 并给 note，**都不编造**。
        与 CLI `show system hugepages` **同一实现**；pools 恒列 1G/2M 两项（形状稳定）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HugepagePools" }
  /system/hugepages:reclaim:
    post:
      tags: [system]
      summary: 回收空闲的多余大页，收敛到声明值（在用页不动；不改声明值；super-user，决策 #329）
      description: |
        与 CLI `request system hugepages reclaim` **同一实现**（同一份派生 + 同一份回收）。
        只回收「内核实际高于声明、且**空闲**」的多余页（#329）；**在用页一律不动**（不抽走 VPP/VNF
        正在用的大页，也不动被进程预留但未使用的页）。
        ⚠️ **无主占用页（`orphan`）不在回收范围**（决策 #346 真机实测撤回）：这类页多为**被进程
        预留（reserve）但未 fault 的大页**（如数据面 DPDK 预留）——它们**不在空闲链表上**，写
        `nr_hugepages` **释放不了**它们（实测 `nr` 不变）；产品侧回收不动它们，只能从预留者一侧释放。
        每个池至多**一次写 + 一次回读**（有界，不重试不循环）：写成功不等于收敛，必须**回读**内核
        实际值——回读与目标不一致即 400 并如实说明原因；无变化即如实报「无可回收的空闲多余页」。
        本动作只收敛到**已声明**值，不改声明值（改声明用 `set resource-pools hugepages … count <n>`，需 reboot）。
        class 为 super-user（与 `request system kernel apply` 同档：都写宿主机内核侧状态）。
      responses:
        "200":
          description: 已执行（无需回收/已回收/被在用页挡住均在此如实呈现）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HugepageReclaimResult" }
        "400": { $ref: "#/components/responses/Error400" }   # 写入失败 / 回读不一致（未收敛）
        "403": { $ref: "#/components/responses/Error403" }
        "503": { description: 大页池回收未接入（未装配写能力） }

