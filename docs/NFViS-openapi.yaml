      description: |
        归档是**完整 committed 配置**（含本地用户口令哈希），恢复账号所必需——故**不脱敏**
        （脱敏即无法恢复），属**权限**问题不是脱敏问题。按 FR-SEC-007 的既有例外口径
        （0600、仅 super-user，见附录 A #70）与生成端 `POST /system/backup` 同级，
        本端点自决策 #143 起要求 super-user（此前为 read-only）。
      responses:
        "200":
          description: application/octet-stream
          content:
